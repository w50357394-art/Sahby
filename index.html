<script id="sahby-notify-js">
(function(){
/* ============================================================
   Sahby Notify
   · كتم كل الرسائل / كتم محادثة (ساعة · 8 ساعات · أسبوع · دائمًا)
   · إشعارات النظام وإنت خارج التطبيق + بانر داخل التطبيق
   · أصوات، اهتزاز، إخفاء نص الرسالة، عدّاد على التبويب وأيقونة التطبيق
   · التنقل السريع Ctrl/⌘ + K
   ============================================================ */
const G=window,$$=id=>document.getElementById(id);
const NT=(a,e)=>(typeof lang!=='undefined'&&lang==='ar')?a:e;
const S=p=>`<svg class="ic" viewBox="0 0 24 24">${p}</svg>`;
const I={
 bell:S('<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'),
 bellOff:S('<path d="M13.7 21a2 2 0 0 1-3.4 0"/><path d="M18.6 13A17.9 17.9 0 0 1 18 8"/><path d="M6.3 6.3A6 6 0 0 0 6 8c0 7-3 9-3 9h14"/><path d="M18 8a6 6 0 0 0-9.3-5"/><path d="m2 2 20 20"/>'),
 vol:S('<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/>'),
 eye:S('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
 vib:S('<path d="m2 8 2 4-2 4"/><path d="m22 8-2 4 2 4"/><rect x="7" y="4" width="10" height="16" rx="2"/>'),
 clock:S('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
 search:S('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>')
};

/* المساحة الخاصة: نقرأ المعرّفات من نفس مفتاح التخزين (الدالة الأصلية مش متاحة برا نطاقها) */
const vaultIds=()=>{try{return me?((JSON.parse(localStorage.getItem('sahby_vault_'+me.id)||'null')||{}).ids||[]):[]}catch(e){return[]}};

/* ---------- التفضيلات ---------- */
const PK='sahby_notify_prefs';
const prefs=Object.assign({muteAll:false,sound:true,preview:true,vibrate:true},LSget(PK,{}));
const savePrefs=()=>LSset(PK,prefs);

/* ---------- كتم المحادثات (لكل مستخدم) ---------- */
let mutes={},mutesFor=null;
const MKEY=()=>'sahby_mutes_'+me.id;
function loadMutes(){if(!me){mutes={};mutesFor=null;return}if(mutesFor===me.id)return;mutesFor=me.id;mutes=LSget(MKEY(),{})||{}}
function isMuted(id){
 if(!me)return false;loadMutes();const u=mutes[id];
 if(u===undefined)return false;if(u===-1||u>Date.now())return true;
 delete mutes[id];LSset(MKEY(),mutes);return false;
}
function muteLabel(id){
 const u=mutes[id];if(u===-1)return NT('مكتومة دائمًا','Muted always');
 const d=new Date(u),far=(u-Date.now())>20*36e5;
 const s=d.toLocaleString(typeof locale==='function'?locale():undefined,far?{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}:{hour:'2-digit',minute:'2-digit'});
 return NT('مكتومة حتى '+s,'Muted until '+s);
}
function muteChat(id,ms){loadMutes();mutes[id]=ms===-1?-1:Date.now()+ms;LSset(MKEY(),mutes);afterChange()}
function unmuteChat(id){loadMutes();delete mutes[id];LSset(MKEY(),mutes);afterChange()}

/* ---------- العدّاد ---------- */
function unreadCount(){
 let n=0;const v=vaultIds();
 try{for(const k in meta){if(v.includes(k)||isMuted(k))continue;n+=(meta[k]&&meta[k].unread)||0}}catch(e){}
 return n;
}
const BASE='صحبي | Sahby Chat';
function fixTitle(){
 try{
  const n=prefs.muteAll?0:unreadCount(),t=document.title;
  if(t===BASE||(/^\(\d+\+?\)\s/.test(t)&&t.endsWith(BASE))){
   const want=n?`(${n>99?'99+':n}) ${BASE}`:BASE;if(t!==want)document.title=want;
  }
  if(navigator.setAppBadge){const pr=n?navigator.setAppBadge(n):(navigator.clearAppBadge&&navigator.clearAppBadge());if(pr&&pr.catch)pr.catch(()=>{})}
 }catch(e){}
}
try{const te=document.querySelector('title');if(te)new MutationObserver(fixTitle).observe(te,{childList:true,characterData:true,subtree:true})}catch(e){}
const _sb=setBadge;
setBadge=function(id,n){if(id==='nbChats')n=unreadCount();return _sb.call(this,id,n)};

/* ---------- الأصوات ---------- */
const _pd=G.playDing;
G.playDing=function(){if(!prefs.sound||prefs.muteAll)return;return _pd&&_pd.apply(this,arguments)};
let ac=null;
const AC=()=>{const A=G.AudioContext||G.webkitAudioContext;if(!A)return null;if(!ac)ac=new A();if(ac.state==='suspended')ac.resume().catch(()=>{});return ac};
['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,()=>{try{AC()}catch(e){}},{passive:true}));
function pop(){
 if(!prefs.sound||prefs.muteAll)return;
 try{const c=AC();if(!c)return;const t=c.currentTime,o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(860,t+.07);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.09);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.1)}catch(e){}
}

/* ---------- إشعارات النظام ---------- */
const perm=()=>('Notification' in G)?Notification.permission:'unsupported';
const appIcon=()=>{try{const l=document.querySelector('link[rel="icon"]');return l?l.href:undefined}catch(e){return undefined}};
const okUrl=u=>typeof u==='string'&&/^https?:/i.test(u);
function focusApp(){try{G.focus()}catch(e){}}
function goChat(id){
 try{if(!id||!me)return;focusApp();sub=null;view='chats';renderSide();if(chatById(id))openChat(id)}catch(e){}
}
async function showSys(o){
 if(perm()!=='granted')return false;
 const opts={body:o.body,tag:o.tag,icon:okUrl(o.icon)?o.icon:appIcon(),badge:appIcon(),dir:'auto',renotify:true,data:{chatId:o.chatId||''}};
 if(prefs.vibrate)opts.vibrate=[120,60,120];
 try{
  if('serviceWorker' in navigator){const r=await navigator.serviceWorker.getRegistration();
   if(r&&typeof r.showNotification==='function'&&r.active){await r.showNotification(o.title,opts);return true}}
 }catch(e){}
 try{const n=new Notification(o.title,opts);n.onclick=()=>{focusApp();if(o.chatId)goChat(o.chatId);n.close()};return true}catch(e){return false}
}
async function clearNotes(key){
 try{if(!('serviceWorker' in navigator))return;const r=await navigator.serviceWorker.getRegistration();
  if(r&&r.getNotifications){(await r.getNotifications({tag:'sahby-chat-'+key})).forEach(n=>n.close())}}catch(e){}
}
async function senderOf(row){
 let p=pcache[row.sender_id];
 if(!p&&db){try{const r=await Promise.race([db.from('profiles').select('*').eq('id',row.sender_id).maybeSingle(),new Promise(res=>setTimeout(()=>res(null),2500))]);
  if(r&&r.data){p=r.data;pcache[p.id]=p}}catch(e){}}
 return p||{};
}
function previewOf(row){
 if(!prefs.preview)return NT('رسالة جديدة','New message');
 let b='';try{b=String(msgPreview(row)||'')}catch(e){}
 b=b.replace(/\u2063/g,'').trim()||NT('رسالة جديدة','New message');
 return b.length>120?b.slice(0,117)+'…':b;
}
async function buildNote(row,key,grp,vault){
 if(vault)return{title:'صحبي · Sahby',body:NT('وصلتك رسالة جديدة في المساحة الخاصة 🔒','New message in your private space 🔒'),tag:'sahby-vault',chatId:''};
 const sp=await senderOf(row),sname=profileName(sp),body=previewOf(row);
 if(grp){const g=chatById(key);const gn=(g&&profileName(g))||NT('مجموعة','Group');
  return{title:gn,body:sname+': '+body,tag:'sahby-chat-'+key,chatId:key,icon:(g&&g.avatar_url)||sp.avatar_url}}
 return{title:sname,body,tag:'sahby-chat-'+key,chatId:key,icon:sp.avatar_url};
}

/* ---------- بانر داخل التطبيق ---------- */
let bnT=null,bnChat=null;
function banner(p,sub2,key){
 try{
  let b=$$('ntBanner');
  if(!b){b=document.createElement('div');b.id='ntBanner';b.setAttribute('role','status');document.body.appendChild(b);
   b.onclick=()=>{b.classList.remove('show');if(bnChat)goChat(bnChat)}}
  bnChat=key;
  b.innerHTML=`${av(p)}<div class="nt-t"><b>${esc(profileName(p))}</b><small>${esc(sub2)}</small></div>`;
  void b.offsetWidth;b.classList.add('show');clearTimeout(bnT);bnT=setTimeout(()=>b.classList.remove('show'),4200);
 }catch(e){}
}

/* ---------- استقبال الرسائل لحظيًا ---------- */
let seen=new Set(),ch=null,chFor=null,chDb=null;
async function onInsert(table,row){
 try{
  if(!me||!row||!row.id||seen.has(row.id))return;
  seen.add(row.id);if(seen.size>300)seen=new Set([...seen].slice(-150));
  const grp=table==='group_messages';
  if(row.sender_id===me.id)return;
  if(!grp&&row.receiver_id!==me.id)return;
  if(typeof row.content==='string'&&row.content.startsWith('📞CALL|'))return;
  if(typeof hiddenIds!=='undefined'&&hiddenIds.has(String(row.id)))return;
  const key=grp?'g:'+row.group_id:row.sender_id;
  if(blockedIds.has(row.sender_id)||prefs.muteAll||isMuted(key))return;
  const out=document.visibilityState==='hidden'||!document.hasFocus();
  const viewing=!out&&currentFriend&&currentFriend.id===key;
  const vault=vaultIds().includes(key);
  let shown=false;
  if(out&&perm()==='granted'){shown=await showSys(await buildNote(row,key,grp,vault))}
  if(shown)return;
  if(viewing){pop();return}
  if(prefs.sound)G.playDing();
  if(!out&&prefs.vibrate&&navigator.vibrate){try{navigator.vibrate(60)}catch(e){}}
  if(!out&&!vault){const sp=await senderOf(row);
   const who=grp?(chatById(key)||sp):sp;
   banner(who,(grp?profileName(sp)+': ':'')+previewOf(row),key)}
 }catch(e){console.warn('sahby-notify',e)}
}
function ensureChannel(){
 if(!db||!me)return;
 if(typeof offlineMode!=='undefined'&&offlineMode)return;
 if(ch&&chFor===me.id&&chDb===db)return;
 try{if(ch&&chDb)chDb.removeChannel(ch)}catch(e){}
 ch=null;
 try{
  chDb=db;chFor=me.id;
  ch=db.channel('sahby-notify-'+me.id)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>onInsert('messages',p.new))
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'group_messages'},p=>onInsert('group_messages',p.new))
   .subscribe();
 }catch(e){console.warn('sahby-notify channel',e)}
}

/* ---------- زر الكتم في هيدر المحادثة ---------- */
function paintHeader(){
 const h=document.querySelector('.chathead');if(!h)return;
 let b=$$('ntMute');
 if(!b){b=document.createElement('button');b.type='button';b.id='ntMute';b.className='ibtn hidden';
  b.onclick=()=>{if(currentFriend)openMuteSheet(currentFriend.id)};
  h.insertBefore(b,$$('blockBtn')||$$('chatMore')||null)}
 const f=currentFriend,show=!!f&&!f.isSys,m=show&&isMuted(f.id);
 b.classList.toggle('hidden',!show);b.classList.toggle('on',!!m);
 if(show){const lbl=m?NT('إلغاء كتم الرسائل','Unmute messages'):NT('كتم الرسائل','Mute messages');
  b.title=lbl;b.setAttribute('aria-label',lbl);
  const want=m?'o':'i';if(b.dataset.s!==want){b.dataset.s=want;b.innerHTML=m?I.bellOff:I.bell}}
}

/* ---------- نافذة الكتم ---------- */
function opt(ic,title,sub2,fn,cls){
 return `<button class="opt ${cls||''}" onclick="${fn}"><span class="oi">${ic}</span><span><b>${esc(title)}</b>${sub2?`<small>${esc(sub2)}</small>`:''}</span></button>`;
}
function openMuteSheet(id){
 const p=chatById(id);if(!p||p.isSys)return;
 const m=isMuted(id);
 const durs=[[36e5,'ساعة واحدة','1 hour'],[8*36e5,'8 ساعات','8 hours'],[7*864e5,'أسبوع','1 week'],[-1,'دائمًا','Always']];
 sheet(`<div class="grab"></div><div class="cm-head">${av(p)}<div><b>${esc(profileName(p))}</b><small>${esc(m?muteLabel(id):NT('الإشعارات شغّالة','Notifications on'))}</small></div></div>`
  +(m?opt(I.bell,NT('إلغاء الكتم','Unmute'),NT('رجّع الإشعارات والأصوات','Turn alerts and sounds back on'),`sahbyNotify.unmute('${id}')`)
     :`<div class="sect" style="padding:4px 6px 10px">${esc(NT('كتم الإشعارات لمدة','Mute notifications for'))}</div>`+durs.map(([ms,a,e])=>opt(ms===-1?I.bellOff:I.clock,NT(a,e),'',`sahbyNotify.mute('${id}',${ms})`)).join(''))
  +`<button class="btn secondary big" onclick="closeSheet()">${esc(t('cancel'))}</button>`);
}

/* ---------- قائمة الضغط المطوّل على المحادثة ---------- */
const _ocm=openChatMenu;
openChatMenu=function(id){
 _ocm.apply(this,arguments);
 try{
  const bs=$$('bsheet'),p=chatById(id);
  if(!bs||!p||p.isSys||!bs.querySelector('.cm-head')||bs.querySelector('.ntopt'))return;
  const m=isMuted(id);
  const html=opt(m?I.bell:I.bellOff,m?NT('إلغاء كتم الرسائل','Unmute messages'):NT('كتم الرسائل','Mute messages'),m?muteLabel(id):NT('إيقاف إشعارات وأصوات المحادثة','Silence alerts and sounds'),m?`sahbyNotify.unmute('${id}')`:`openMuteSheet('${id}')`,'ntopt');
  const anchor=bs.querySelector('.opt.danger')||bs.querySelector('.btn.big');
  if(anchor)anchor.insertAdjacentHTML('beforebegin',html);else bs.insertAdjacentHTML('beforeend',html);
 }catch(e){}
};

/* ---------- الإعدادات ---------- */
function settingsHtml(){
 const pm=perm();
 const sysSub=prefs.muteAll?NT('متوقفة حاليًا لأن كتم الرسائل شغّال','Paused while Mute is on')
  :pm==='granted'?NT('شغّالة — اضغط لإرسال إشعار تجريبي','On — tap to send a test alert')
  :pm==='denied'?NT('محظورة من إعدادات المتصفح — اسمح بيها من قفل الرابط','Blocked in browser settings')
  :pm==='unsupported'?NT('مش مدعومة في المتصفح ده','Not supported in this browser')
  :NT('فعّلها عشان توصلك الرسائل وإنت برا التطبيق','Enable to get alerts outside the app');
 const row=(ic,title,sub2,on,act,cls)=>`<button class="ritem ${cls||''}" onclick="${act}">${ic}<span>${esc(title)}<small class="rs">${esc(sub2)}</small></span><i class="sw ${on?'on':''} ${cls||''}"></i></button>`;
 return `<div id="ntSet"><div class="sect">${esc(NT('الإشعارات والصوت','Notifications & sound'))}</div><div class="card">`
  +row(I.bellOff,NT('كتم الرسائل','Mute messages'),NT('إيقاف إشعارات وأصوات كل الرسائل الواردة','Silence alerts and sounds for all incoming messages'),prefs.muteAll,"sahbyNotify.toggle('muteAll')",'amber')
  +row(I.bell,NT('إشعارات خارج التطبيق','Background notifications'),sysSub,pm==='granted'&&!prefs.muteAll,'sahbyNotify.enableSys()')
  +row(I.vol,NT('أصوات الرسائل','Message sounds'),NT('نغمة عند وصول رسالة جديدة','A tone when a new message arrives'),prefs.sound,"sahbyNotify.toggle('sound')")
  +row(I.eye,NT('إظهار نص الرسالة','Show message preview'),NT('اقفلها لو عايز الإشعار يقول «رسالة جديدة» بس','Turn off to show only “New message”'),prefs.preview,"sahbyNotify.toggle('preview')")
  +((navigator.vibrate)?row(I.vib,NT('الاهتزاز','Vibration'),NT('اهتزاز خفيف مع الرسائل الجديدة','A light buzz for new messages'),prefs.vibrate,"sahbyNotify.toggle('vibrate')"):'')
  +`</div></div>`;
}
function injectSettings(){
 const pf=document.querySelector('#list .pf');if(!pf||pf.querySelector('#ntSet'))return;
 const v6=pf.querySelector('#v6set');
 if(v6)v6.insertAdjacentHTML('afterend',settingsHtml());else pf.insertAdjacentHTML('afterbegin',settingsHtml());
}
function decorateList(){
 document.querySelectorAll('#list .swrap[data-id]').forEach(w=>{
  const id=w.dataset.id,it=w.querySelector('.item');if(!it)return;
  const m=isMuted(id);it.classList.toggle('ntm',m);
  const side=it.querySelector('.iside');if(!side)return;
  const ic=side.querySelector('.ntmi');
  if(m&&!ic)side.insertAdjacentHTML('beforeend',`<span class="ntmi" title="${esc(NT('مكتومة','Muted'))}">${I.bellOff}</span>`);
  else if(!m&&ic)ic.remove();
 });
}
const _rl=renderList;
renderList=function(){
 const r=_rl.apply(this,arguments);
 try{if((sub||view)==='settings'&&sub!=='edit')injectSettings();decorateList()}catch(e){}
 return r;
};
function afterChange(){try{renderList()}catch(e){}try{paintHeader()}catch(e){}try{setBadge('nbChats',0)}catch(e){}fixTitle()}

/* ---------- تفعيل إذن الإشعارات ---------- */
async function enableSys(){
 const p=perm();
 if(p==='unsupported'){toast(NT('المتصفح ده مش بيدعم إشعارات النظام','Notifications are not supported in this browser'));return}
 if(p==='denied'){toast(NT('الإشعارات محظورة — اسمح بيها من أيقونة القفل جنب الرابط','Notifications are blocked — allow them from the lock icon next to the address'));return}
 let r=p;
 if(p!=='granted'){try{r=await Notification.requestPermission()}catch(e){r=perm()}}
 dismissPrompt(true);
 if(r==='granted'){
  if(prefs.muteAll){prefs.muteAll=false;savePrefs()}
  const ok=await showSys({title:'صحبي · Sahby',body:NT('الإشعارات جاهزة! هتوصلك الرسائل الجديدة وإنت برا التطبيق 🔔','Notifications are on! You will get new messages outside the app 🔔'),tag:'sahby-test',chatId:''});
  toast(ok?NT('اتبعت إشعار تجريبي ✓','Test notification sent ✓'):NT('تم تفعيل إذن الإشعارات ✓','Notification permission granted ✓'));
 }else if(r==='denied'){toast(NT('الإشعارات اتحظرت من المتصفح','Notifications were blocked'))}
 refreshSettings();
}
function refreshSettings(){try{if((sub||view)==='settings')renderList()}catch(e){}}

/* ---------- بطاقة التفعيل (مرة كل أسبوع لحد ما توافق) ---------- */
const bootAt=Date.now();
function dismissPrompt(forever){
 const el=$$('ntPrompt');if(el)el.remove();
 LSset('sahby_nt_prompt',forever?Date.now()+30*864e5:Date.now());
}
function maybePrompt(){
 if(!me||!myProfile||typeof profileReady!=='undefined'&&!profileReady)return;
 if(perm()!=='default'||prefs.muteAll||$$('ntPrompt'))return;
 if(Date.now()-bootAt<9000||document.visibilityState!=='visible'||!document.hasFocus())return;
 if(currentFriend||(sub||view)==='edit')return;
 if($$('splash'))return;
 for(const x of ['onb','onbSetup']){const e=$$(x);if(e&&!e.classList.contains('hidden'))return}
 const ts=LSget('sahby_nt_prompt',0);if(ts&&Date.now()-ts<7*864e5)return;
 const el=document.createElement('div');el.id='ntPrompt';
 el.innerHTML=`<span class="nt-i">${I.bell}</span><div class="nt-t"><b>${esc(NT('فعّل الإشعارات','Turn on notifications'))}</b><small>${esc(NT('عشان توصلك رسائل أصحابك حتى وإنت برا التطبيق','So you get your friends’ messages even when you’re away'))}</small></div><div class="nt-b"><button class="btn small" onclick="sahbyNotify.enableSys()">${esc(NT('تفعيل','Enable'))}</button><button class="btn secondary small" onclick="sahbyNotify.later()">${esc(NT('لاحقًا','Later'))}</button></div>`;
 document.body.appendChild(el);
}

/* ---------- التنقل السريع Ctrl/⌘ + K ---------- */
function closeQuick(){const o=$$('ntQ');if(o)o.remove()}
function openQuick(){
 if(!me)return;if($$('ntQ')){closeQuick();return}
 const o=document.createElement('div');o.id='ntQ';
 o.innerHTML=`<div class="ntq-box" role="dialog" aria-modal="true"><div class="ntq-in">${I.search}<input id="ntQi" autocomplete="off" placeholder="${esc(NT('انتقل سريعًا لأي صديق أو مجموعة...','Jump to any friend or group...'))}"><kbd>Esc</kbd></div><div class="ntq-list" id="ntQl"></div></div>`;
 document.body.appendChild(o);
 const inp=$$('ntQi'),list=$$('ntQl');let idx=0,rows=[];
 const draw=()=>{
  const q=inp.value.trim().toLowerCase(),v=vaultIds();
  rows=[...friends,...groupsP].filter(c=>!v.includes(c.id)&&!blockedIds.has(c.id)&&(!q||profileName(c).toLowerCase().includes(q)||(c.username||'').toLowerCase().includes(q)))
   .sort((a,b)=>lastTs(b.id)-lastTs(a.id)).slice(0,30);
  if(idx>=rows.length)idx=Math.max(0,rows.length-1);
  list.innerHTML=rows.length?rows.map((c,i)=>{const u=(meta[c.id]&&meta[c.id].unread)||0;
   return `<button class="ntq-r ${i===idx?'on':''}" data-i="${i}">${av(c)}<span><b>${esc(profileName(c))}</b><small>${esc(c.isGroup?tx('membersN',(c.members||[]).length):'@'+(c.username||''))}</small></span>${isMuted(c.id)?`<span class="ntmi" style="flex:0">${I.bellOff}</span>`:''}${u?`<span class="ntq-n">${u}</span>`:''}</button>`}).join('')
   :`<div class="ntq-e">${esc(NT('مفيش نتايج','No results'))}</div>`;
  const on=list.querySelector('.ntq-r.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'});
 };
 const go=i=>{const c=rows[i];if(!c)return;closeQuick();goChat(c.id)};
 inp.addEventListener('input',()=>{idx=0;draw()});
 inp.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();idx=Math.min(rows.length-1,idx+1);draw()}
  else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(0,idx-1);draw()}
  else if(e.key==='Enter'){e.preventDefault();go(idx)}
 });
 list.addEventListener('click',e=>{const b=e.target.closest('.ntq-r');if(b)go(+b.dataset.i)});
 o.addEventListener('mousedown',e=>{if(e.target===o)closeQuick()});
 draw();setTimeout(()=>inp.focus(),30);
}
window.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key&&e.key.toLowerCase()==='k'){if(me){e.preventDefault();openQuick()}}
 else if(e.key==='Escape'&&$$('ntQ'))closeQuick();
});

/* ---------- ربط مع باقي التطبيق ---------- */
G.sahbyNotify={
 mute(id,ms){muteChat(id,ms);closeSheet();toast(ms===-1?NT('تم كتم المحادثة 🔕','Conversation muted 🔕'):NT('تم كتم المحادثة مؤقتًا 🔕','Conversation muted for a while 🔕'))},
 unmute(id){unmuteChat(id);closeSheet();toast(NT('تم إلغاء كتم المحادثة 🔔','Conversation unmuted 🔔'))},
 toggle(k){
  prefs[k]=!prefs[k];savePrefs();
  if(k==='muteAll')toast(prefs.muteAll?NT('تم كتم إشعارات كل الرسائل 🔕','All message alerts muted 🔕'):NT('تم تفعيل إشعارات الرسائل 🔔','Message alerts on 🔔'));
  if(k==='sound'&&prefs.sound)G.playDing();
  if(k==='vibrate'&&prefs.vibrate&&navigator.vibrate){try{navigator.vibrate(80)}catch(e){}}
  if(k==='muteAll'&&!prefs.muteAll&&perm()==='default')enableSys();
  renderList();fixTitle();
 },
 enableSys,later(){dismissPrompt(false)},openQuick,openMuteSheet,isMuted,
 state:()=>({prefs:{...prefs},mutes:{...mutes},permission:perm()})
};
G.openMuteSheet=openMuteSheet;

const _sc=showChat;
showChat=function(f){const r=_sc.apply(this,arguments);try{paintHeader();if(f&&f.id)clearNotes(f.id)}catch(e){}return r};
const _acs=applyChatState;
applyChatState=function(){const r=_acs.apply(this,arguments);try{paintHeader()}catch(e){}return r};

/* الضغط على الإشعار: فتح المحادثة */
let pendingChat=null;
try{pendingChat=new URLSearchParams(location.search).get('chat')}catch(e){}
if('serviceWorker' in navigator){
 navigator.serviceWorker.addEventListener('message',e=>{const d=e.data||{};if(d.type==='sahby-open-chat'&&d.chatId)pendingChat=d.chatId});
}
['focus','visibilitychange'].forEach(ev=>G.addEventListener(ev,()=>{refreshSettings();fixTitle()}));
document.addEventListener('visibilitychange',()=>{refreshSettings()});

/* نبض خفيف: قناة الرسائل، زر الهيدر، انتهاء مدة الكتم، فتح محادثة من إشعار */
setInterval(()=>{
 try{
  ensureChannel();paintHeader();maybePrompt();
  if(me){loadMutes();let ex=false;const n=Date.now();
   for(const k in mutes){if(mutes[k]!==-1&&mutes[k]<=n){delete mutes[k];ex=true}}
   if(ex){LSset(MKEY(),mutes);afterChange()}}
  if(pendingChat&&me&&chatById(pendingChat)){const id=pendingChat;pendingChat=null;goChat(id)}
 }catch(e){}
},1500);
fixTitle();
})();
</script>

</body></html>
