const permState=async n=>{try{return (await navigator.permissions.query({name:n})).state}catch(e){return 'unknown'}};
async function ensurePermission(kind){
 const names=kind==='both'?['camera','microphone']:[kind==='mic'?'microphone':'camera'];
 const st=await Promise.all(names.map(permState));
 if(st.every(s=>s==='granted'))return true;
 if(st.includes('denied')){await permDenied(kind);return false}
 const key='sahby_perm_'+kind;let seen=false;try{seen=!!localStorage.getItem(key)}catch(e){}
 if(seen)return true;
 const T={camera:{icon:IC.cam,title:'اسمح لصحبي بالكاميرا',text:'عشان تصوّر صورة لحظية وتبعتها في المحادثة أو القصة.'},mic:{icon:IC.mic,title:'اسمح لصحبي بالميكروفون',text:'عشان تسجّل رسالة صوتية وتبعتها لصاحبك.'},both:{icon:IC.video,title:'اسمح لصحبي بالكاميرا والميكروفون',text:'عشان تصوّر فيديو بالصوت وتبعته لأصحابك.'}}[kind];
 const ok=await permModal({...T,points:['الوصول بيحصل بس وانت بتصوّر أو بتسجّل','مفيش حاجة بتتسجّل أو بتترفع من غير ما انت تبعتها','تقدر تغيّر قرارك في أي وقت من إعدادات المتصفح'],okText:'السماح',cancelText:'مش دلوقتي'});
 if(ok){try{localStorage.setItem(key,'1')}catch(e){}}
 return ok;
}
function permDenied(kind){return permModal({icon:IC.ban,title:'الإذن مقفول',text:'المتصفح مانع الوصول لـ'+(kind==='mic'?'الميكروفون':kind==='camera'?'الكاميرا':'الكاميرا والميكروفون')+'. افتح إعدادات الموقع (أيقونة القفل أو ⋮ جنب العنوان) ← الأذونات ← فعّله، وبعدين ارجع جرّب تاني.',okText:'تمام'})}
function mediaError(e,kind){
 const n=e&&e.name;
 if(n==='NotAllowedError'||n==='SecurityError')permDenied(kind==='mic'?'mic':'camera');
 else if(n==='NotFoundError'||n==='OverconstrainedError')toast('مفيش كاميرا أو ميكروفون متاح على الجهاز');
 else if(n==='NotReadableError')toast('الكاميرا أو الميكروفون مستخدم من تطبيق تاني');
 else toast('تعذّر تشغيل الكاميرا: '+(e?.message||''));
}

 if(!currentFriend||!db)return;
 const f=currentFriend,id=f.id,ck='sahby_msgs_'+me.id+'_'+id;let rows,fromNet=true;
 if(f.isGroup){
  const r=await db.from('group_messages').select('*').eq('group_id',f.gid).order('created_at',{ascending:false}).limit(300);
  if(r.error){if(isNetErr(r.error)){rows=LSget(ck,[]);fromNet=false}else{if(!silent)toast(r.error.message);return}}
  else rows=(r.data||[]).slice().reverse().map(m=>({...m,receiver_id:null,seen:true}));
  if(currentFriend?.id!==id)return;
  if(fromNet&&rows.length){gread[id]=rows[rows.length-1].created_at;LSset('sahby_gread_'+me.id,gread)}
 }else{
  const r=await db.from('messages').select('*').or(`and(sender_id.eq.${me.id},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${me.id})`).order('created_at',{ascending:false}).limit(300);
  if(r.error){if(isNetErr(r.error)){rows=LSget(ck,[]);fromNet=false}else{if(!silent)toast('تعذّر تحميل الرسائل: '+r.error.message);return}}
  else rows=(r.data||[]).slice().reverse();
  if(currentFriend?.id!==id)return;
  if(fromNet&&rows.some(m=>m.receiver_id===me.id&&!m.seen)&&!isBlockedChat()){
   db.from('messages').update({seen:true}).eq('receiver_id',me.id).eq('sender_id',id).eq('seen',false).then(()=>refreshAll(true));
  }
 }
 curRows=rows;if(fromNet)LSset(ck,rows.slice(-120));
 const sig=rows.map(m=>m.id+(m.seen?1:0)+(m.delivered===false?'d':'')).join(',')+'|'+hiddenIds.size+'|'+ghosts.length+'|'+clrAt(id)+'|'+lang+'|'+outbox.length+'|'+stars.length;
 if(sig!==lastSig){lastSig=sig;renderMessages(rows)}
}

 if(offlineMode||!navigator.onLine||(outbox.length&&kind==='text')){if(kind==='text'){const q=queue();if(navigator.onLine&&!offlineMode)setTimeout(flushOutbox,0);return q}toast(tx('needNet'));return false}
 const ins=isG?{group_id:to.slice(2),sender_id:me.id,...row,content}:{sender_id:me.id,receiver_id:to,...row,content};
 if(rid)ins.reply_to=rid;

let micP=null,recTick=null,recAC=null,recAn=null;
const WAVE_N=34;
async function startRecording(){
 if(!currentFriend||isBlockedChat())return false;
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('متصفحك لا يدعم التسجيل الصوتي');return false}
 if(!await ensurePermission('mic'))return false;
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':(MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'');
  const mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);const chunks=[];
  const mt=mime||mr.mimeType||'audio/webm';
  rec={mr,stream,chunks,mime:mt,send:false,friend:currentFriend,t0:Date.now(),locked:false};
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=async()=>{
   stream.getTracks().forEach(t=>t.stop());
   const r=rec;rec=null;setRecUi(false);
   if(!r.send)return;
   if(Date.now()-r.t0<800)return toast('التسجيل قصير جدًا');
   try{toast('جاري رفع التسجيل...');const blob=new Blob(r.chunks,{type:r.mime});const url=await uploadFile('chat-media',blob,r.mime.includes('webm')?'webm':r.mime.includes('ogg')?'ogg':'m4a',r.mime.split(';')[0]);
    await sendMessage({kind:'audio',media_url:url,content:''},r.friend.id)}catch(err){toast(err.message)}
  };
  mr.start();
  try{recAC=new (window.AudioContext||window.webkitAudioContext)();const src=recAC.createMediaStreamSource(stream);recAn=recAC.createAnalyser();recAn.fftSize=128;src.connect(recAn)}catch(e){recAn=null}
  setRecUi(true);
  if(micP&&micP.up&&!rec.locked){micP=null;lockRec()}
  return true;
 }catch(e){mediaError(e,'mic');return false}
}
function lockRec(){if(!rec)return;rec.locked=true;$('recHintT').textContent=t('recing');$('micBtn').classList.add('lock');$('micBtn').innerHTML=IC.send;$('recHintT').parentElement.querySelector('.arr').style.display='none'}
function stopRecording(send){if(rec&&rec.mr.state!=='inactive'){rec.send=send;rec.mr.stop()}}
function cancelRecording(){stopRecording(false)}
function setRecUi(on){
 $('recTop').classList.toggle('show',on);$('messageForm').classList.toggle('recing',on);
 $('messageInput').disabled=on;
 clearInterval(recTick);
 if(on){
  $('recWave').innerHTML=Array.from({length:WAVE_N},()=>'<i></i>').join('');
  $('recHintT').textContent=t('slideCancel');$('recHintT').parentElement.querySelector('.arr').style.display='';
  const bars=[...$('recWave').children],data=new Uint8Array(64);
  recTick=setInterval(()=>{
   if(!rec)return;const s=(Date.now()-rec.t0)/1000;$('recTime').textContent=fmtT(s);
   let lv=.15+Math.random()*.25;
   if(recAn){recAn.getByteFrequencyData(data);let sum=0;for(let i=2;i<30;i++)sum+=data[i];lv=Math.min(1,sum/28/140)}
   bars.forEach((b,i)=>{if(i<bars.length-1)b.style.height=bars[i+1].style.height||'4px'});
   bars[bars.length-1].style.height=Math.max(4,Math.round(lv*34))+'px';
  },70);
 }else{
  try{recAC&&recAC.close()}catch(e){}recAC=null;recAn=null;micP=null;$('micBtn').classList.remove('lock');$('recHintT').parentElement.style.transform='';
 }
 updateComposer();
}
$('micBtn').addEventListener('pointerdown',e=>{
 if(e.button>0)return;
 if(rec){if(rec.locked){e.preventDefault();stopRecording(true)}return}
 e.preventDefault();micP={x:e.clientX,t:Date.now(),up:false};
 try{$('micBtn').setPointerCapture(e.pointerId)}catch(_){}
 startRecording().then(ok=>{if(!ok)micP=null});
});
window.addEventListener('pointermove',e=>{

 const h=$('recHintT').parentElement;h.style.transform=`translateX(${pull*sgn}px)`;h.style.opacity=String(1-pull/180);

});
const micUp=()=>{

};
window.addEventListener('pointerup',micUp);window.addEventListener('pointercancel',micUp);
$('micBtn').addEventListener('contextmenu',e=>e.preventDefault());

$('nav').addEventListener('click',e=>{const b=e.target.closest('.navbtn');if(!b)return;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')});
const _rs=renderSide;renderSide=function(){_rs.apply(this,arguments);navInd()};

let retGroup=null;
window.openMember=async function(uid,fromInfo){
 if(!uid||!me)return;if(uid===me.id)return viewProfile(myProfile);
 let p=pcache[uid];
 if(!p||!p.username){const r=await db.from('profiles').select('*').eq('id',uid).maybeSingle();if(r.error||!r.data)return toast(T('تعذّر فتح البروفايل','Could not open profile'));p=r.data;pcache[uid]=p}
 retGroup=fromInfo&&currentFriend?.isGroup?currentFriend:null;
 viewProfile(p);
 const pr=$('prof'),isF=friends.some(x=>x.id===uid);
 if(!isF&&!blockedIds.has(uid)){const b=`<button class="act" onclick="sendRequest('${uid}')">${IC.users}<span>${T('إضافة صديق','Add friend')}</span></button>`;
  const ac=pr.querySelector('.acts');if(ac)ac.insertAdjacentHTML('afterbegin',b);else{const c=pr.querySelector('.card');if(c)c.insertAdjacentHTML('beforebegin',`<div class="acts" style="padding:0 16px">${b}</div>`)}}
 const bk=pr.querySelector('.phback');if(bk)bk.onclick=()=>{const g=retGroup;retGroup=null;g?viewGroup(g):closeProfile()};
};
$('messages').addEventListener('click',e=>{const n=e.target.closest('.sname');if(!n)return;const b=n.closest('.bubble');
 const m=b&&curRows.find(x=>String(x.id)===b.dataset.id);if(m&&m.sender_id&&m.sender_id!==me.id){e.stopPropagation();openMember(m.sender_id,false)}});
/* ---- رسالة خطأ ودّية للريأكشن ---- */
window.friendlyRx=function(e){const s=String(e&&e.message||e||'');
 if(/row-level security|policy|permission/i.test(s))return T('مش مسموحلك تتفاعل مع الرسالة دي','You are not allowed to react to this message');
 if(/fetch|network|offline/i.test(s))return T('مفيش اتصال بالإنترنت، جرّب تاني','No connection, try again');
 return T('تعذّر إضافة التفاعل، حاول مرة أخرى','Could not save the reaction, try again')};
})();

<script>
(function(){
const $=id=>document.getElementById(id),T=(a,e)=>lang==='ar'?a:e;
IC.file=S('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>');
const ICsm=S('<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9.5v.01M15 9.5v.01"/>');
const ICal={center:S('<path d="M4 6h16M7 12h10M5 18h14"/>'),left:S('<path d="M4 6h16M4 12h10M4 18h14"/>'),right:S('<path d="M4 6h16M10 12h10M6 18h14"/>')};

/* ---------- إصلاح copyText ---------- */
copyText=async function(s){
 try{await navigator.clipboard.writeText(s)}
 catch(e){const a=document.createElement('textarea');a.value=s;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}

};

/* ---------- 1) إرسال ملفات ---------- */
const FMAX=25*1048576;
const isFileMsg=m=>!!m&&m.kind==='text'&&!!m.media_url&&/^📎/.test(m.content||'');
async function sendFileMsg(file,to){
 if(!to)return;
 if(file.size>FMAX)return toast(T('الملف أكبر من 25 ميجا','The file is larger than 25 MB'));
 if(offlineMode||!navigator.onLine)return toast(tx('needNet'));
 const ext=((file.name.match(/\.([a-z0-9]{1,8})$/i)||[])[1]||'bin').toLowerCase();
 toast(T('جاري رفع الملف...','Uploading file...'));
 try{
  const url=await uploadFile('chat-media',file,ext,file.type||'application/octet-stream');
  await sendMessage({kind:'text',media_url:url,content:'📎 '+file.name.slice(0,120)},to);
 }catch(e){toast(e.message)}
}
const fi=document.createElement('input');fi.type='file';fi.id='inFile';fi.className='hidden';document.body.appendChild(fi);
fi.onchange=()=>{const f=fi.files[0];fi.value='';if(f&&pickFriend)sendFileMsg(f,pickFriend.id)};
window.pickFile=()=>{pickTarget='chat';pickFriend=currentFriend;fi.click()};
const _b7=bubble;
bubble=function(m,map){
 if(!isFileMsg(m))return _b7(m,map);
 const u=/^https:\/\//.test(m.media_url||'')?safeUrl(m.media_url):'',name=m.content.replace(/^📎\s*/,''),ext=(name.split('.').pop()||'file').slice(0,4);
 const href=u?u+(u.includes('?')?'&':'?')+'download='+encodeURIComponent(name):'#';
 const card=`<a class="fcard" href="${href}" target="_blank" rel="noopener"><span class="fi">${esc(ext)}</span><span class="fn"><b>${esc(name)}</b><small>${T('اضغط للتنزيل','Tap to download')}</small></span><span class="dl">${IC.arrowDown}</span></a>`;
 return _b7({...m,content:'\u200b'},map).replace('\u200b',card);
};
const _de=window.doEdit5;
if(_de)window.doEdit5=function(id){
 const m=curRows.find(x=>String(x.id)===String(id)),el=$('edTxt');
 if(m&&isFileMsg(m)&&el&&!/^📎/.test(el.value))el.value='📎 '+el.value;
 return _de(id);
};
const mn=$('main');
['dragenter','dragover'].forEach(n=>mn.addEventListener(n,e=>{
 if(!currentFriend||currentFriend.isSys||isBlockedChat()||!e.dataTransfer||![...e.dataTransfer.types].includes('Files'))return;
 e.preventDefault();$('chatPanel').classList.add('dropz')}));
mn.addEventListener('dragleave',e=>{if(!mn.contains(e.relatedTarget))$('chatPanel').classList.remove('dropz')});
mn.addEventListener('drop',e=>{
 $('chatPanel').classList.remove('dropz');
 if(!currentFriend||currentFriend.isSys||isBlockedChat()||!e.dataTransfer?.files?.length)return;
 e.preventDefault();const f=e.dataTransfer.files[0];pickFriend=currentFriend;pickTarget='chat';
 if(/^(image|video)\//.test(f.type))openEditorFor('chat',f,f.type.startsWith('video/'),{});else sendFileMsg(f,currentFriend.id);
});

/* ---------- 2) نشر القصص: رسائل خطأ واضحة ---------- */
publishStoryItem=async function(res){
 toast(T('جاري نشر القصة...','Posting story...'));
 let step='up';
 try{
  const url=await uploadFile('chat-media',res.blob,res.ext,res.type);
  step='ins';
  const r=await db.from('stories').insert({user_id:me.id,kind:res.isVid?'video':'image',media_url:url,caption:res.caption||null});
  if(r.error)throw r.error;
  toast(T('تم نشر القصة','Story posted'));await refreshAll(true);
 }catch(e){
  const m=String(e&&e.message||e);
  if(/row-level security|policy/i.test(m)){
   const w=step==='up'?T('رفع الملف','the upload'):T('جدول القصص','the stories table');
   toast(T('صلاحيات Supabase مانعة '+w+'. شغّل ملف update4.sql من SQL Editor.','Supabase permissions blocked '+w+'. Run update4.sql in the SQL Editor.'));
  }else toast(m);
 }
};

/* ---------- 3) قصة نصية احترافية ---------- */
const TS_BG=[['#a070ff','#6d3ee0'],['#ff7a9c','#e0334f'],['#34e0b3','#1f7be8'],['#ffb347','#ff5e62'],['#4facfe','#00c6a7'],['#f093fb','#f5576c'],['#43e97b','#38b6a0'],['#fa709a','#fee140'],['#30cfd0','#330867'],['#3a3f55','#14161f'],['#1d2b64','#f8a5c2'],['#000000','#111111']];
const TS_FONTS=["system-ui,'Segoe UI',Tahoma,Arial,sans-serif|800","Georgia,'Times New Roman','Noto Naskh Arabic',serif|700","'Courier New',ui-monospace,monospace|700","'Segoe Script','Comic Sans MS','Bradley Hand',cursive|700"].map(s=>s.split('|'));
const TS_COL=['#ffffff','#111111','#ffd23f','#ff5c7a','#34e0b3','#4aa3ff','#c77dff','#ff9f1c','#2ec4b6'];
const TS_EMO=['😀','😂','😍','🥰','😎','🤩','😭','😡','🥳','🤔','🙏','👍','👏','🔥','❤️','💔','✨','🎉','🌹','☕','🌙','⭐','💯','🚀'];
let tsx=null;
const TSE=document.createElement('div');TSE.className='ed';TSE.id='tse';
TSE.innerHTML=`<div class="ed-top"><button class="ibtn" id="tsClose" aria-label="close"></button><div class="ed-title" id="tsTitle"></div><div style="width:36px"></div></div><div class="ed-stage"><div class="tse-box"><canvas id="tsCv" width="1080" height="1920"></canvas></div></div><div class="tse-in"><textarea class="field" id="tsT" rows="1" maxlength="300"></textarea><button class="send" id="tsGo" aria-label="post"></button></div><div class="ed-tools" id="tsTabs"></div><div class="ed-panel" id="tsPanel"></div>`;
document.body.appendChild(TSE);
$('tsClose').innerHTML=IC.close;$('tsGo').innerHTML=IC.check;
const lum=c=>{const n=parseInt(c.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255};
function rr(x,a,b,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function tsWrap(x,txt,maxW){
 const out=[];
 txt.split('\n').forEach(par=>{let cur='';par.split(/\s+/).filter(Boolean).forEach(w=>{const tr=cur?cur+' '+w:w;if(cur&&x.measureText(tr).width>maxW){out.push(cur);cur=w}else cur=tr});out.push(cur)});
 return out;
}
function tsDraw(cv){
 const s=tsx,W=1080,H=1920,x=cv.getContext('2d');
 x.shadowBlur=0;x.clearRect(0,0,W,H);
 if(s.img){const iw=s.img.naturalWidth||s.img.width,ih=s.img.naturalHeight||s.img.height,k=Math.max(W/iw,H/ih);x.drawImage(s.img,(W-iw*k)/2,(H-ih*k)/2,iw*k,ih*k);x.fillStyle='rgba(0,0,0,.32)';x.fillRect(0,0,W,H)}
 else{const g=x.createLinearGradient(0,0,W,H),c=TS_BG[s.bg];g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);x.fillStyle=g;x.fillRect(0,0,W,H)}
 const txt=s.txt.trim(),[fam,wt]=TS_FONTS[s.font];
 x.textBaseline='middle';
 if(!txt){x.textAlign='center';x.fillStyle='rgba(255,255,255,.55)';x.font=`${wt} 72px ${fam}`;x.fillText(T('اكتب قصتك...','Type your story...'),W/2,H/2);return}
 const pad=110,maxW=W-pad*2,rtl=/[\u0590-\u06FF]/.test(txt);
 let fs=W*(txt.length<40?.1:txt.length<100?.075:.055)*s.size,lines,lh;
 for(let i=0;i<16;i++){x.font=`${wt} ${fs}px ${fam}`;x.direction=rtl?'rtl':'ltr';lines=tsWrap(x,txt,maxW);lh=fs*1.45;if(lines.length*lh<=H*.7||fs<28)break;fs*=.88}
 x.textAlign=s.al;const ax=s.al==='center'?W/2:s.al==='left'?pad:W-pad,y0=H/2-(lines.length-1)*lh/2;
 lines.forEach((l,i)=>{
  const y=y0+i*lh,w=x.measureText(l).width;
  if(s.sty===1){const bx=s.al==='center'?ax-w/2:s.al==='left'?ax:ax-w;x.fillStyle=s.col;rr(x,bx-fs*.3,y-lh*.5,w+fs*.6,lh*.98,fs*.3);x.fill();x.fillStyle=lum(s.col)>.6?'#111111':'#ffffff';x.fillText(l,ax,y)}
  else if(s.sty===2){x.lineJoin='round';x.lineWidth=fs*.2;x.strokeStyle='rgba(0,0,0,.85)';x.strokeText(l,ax,y);x.fillStyle=s.col;x.fillText(l,ax,y)}
  else{x.shadowColor='rgba(0,0,0,.3)';x.shadowBlur=fs*.12;x.fillStyle=s.col;x.fillText(l,ax,y);x.shadowBlur=0}
 });
}
let tsRaf=0;
const tsRender=()=>{cancelAnimationFrame(tsRaf);tsRaf=requestAnimationFrame(()=>tsx&&tsDraw($('tsCv')))};
window.tsSet=function(k,v,quiet){tsx[k]=v;if(k==='bg')tsx.img=null;tsRender();if(!quiet)tsPanel()};
window.tsTab=function(k){tsx.tab=k;tsTabs();tsPanel()};
window.tsEmo=function(e){const ta=$('tsT');ta.setRangeText(e,ta.selectionStart,ta.selectionEnd,'end');ta.dispatchEvent(new Event('input'));ta.focus()};
const tsFile=document.createElement('input');tsFile.type='file';tsFile.accept='image/*';tsFile.className='hidden';document.body.appendChild(tsFile);
window.tsPhoto=()=>{tsFile.value='';tsFile.click()};
tsFile.onchange=async()=>{
 const f=tsFile.files[0];if(!f)return;
 try{let b;try{b=await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){b=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)})}
  tsx.img=b;tsPanel();tsRender()}catch(e){toast(T('تعذّر فتح الصورة','Could not open the image'))}
};
function tsTabs(){
 const L=[['bg',T('الخلفية','Background'),IC.image],['txt',T('النص','Text'),IC.text],['emo',T('إيموجي','Emoji'),ICsm]];
 $('tsTabs').innerHTML=L.map(([k,n,i])=>`<button class="tbtn ${tsx.tab===k?'on':''}" onclick="tsTab('${k}')">${i}<span>${n}</span></button>`).join('');
}
function tsPanel(){
 const s=tsx;let h='';
 if(s.tab==='bg'){
  h=`<div class="tsr">${TS_BG.map((c,i)=>`<button class="tsb ${!s.img&&s.bg===i?'on':''}" style="background:linear-gradient(135deg,${c[0]},${c[1]})" onclick="tsSet('bg',${i})" aria-label="bg"></button>`).join('')}</div><div class="chips"><button class="chip" onclick="tsPhoto()">${IC.image}<span>${T('صورة من المعرض','Photo background')}</span></button>${s.img?`<button class="chip" onclick="tsSet('img',null)">${IC.close}<span>${T('إزالة الصورة','Remove photo')}</span></button>`:''}</div>`;
 }else if(s.tab==='txt'){
  const FN=[T('عادي','Modern'),'Serif','Mono',T('يدوي','Script')],ST=[T('بدون','Plain'),T('تعبئة','Fill'),T('حدود','Outline')];
  h=`<div class="tsl">${T('الخط','Font')}</div><div class="chips">${FN.map((n,i)=>`<button class="chip ${s.font===i?'on':''}" style="font-family:${TS_FONTS[i][0]}" onclick="tsSet('font',${i})">${n}</button>`).join('')}</div>
<div class="tsl">${T('التنسيق والمحاذاة','Style & alignment')}</div><div class="chips">${ST.map((n,i)=>`<button class="chip ${s.sty===i?'on':''}" onclick="tsSet('sty',${i})">${n}</button>`).join('')}${['left','center','right'].map(a=>`<button class="chip ${s.al===a?'on':''}" onclick="tsSet('al','${a}')" aria-label="${a}">${ICal[a]}</button>`).join('')}</div>
<div class="tsl">${T('اللون','Color')}</div><div class="colors" style="flex-wrap:wrap">${TS_COL.map(c=>`<i class="${s.col===c?'on':''}" style="background:${c}" onclick="tsSet('col','${c}')"></i>`).join('')}</div>
<div class="tsl">${T('الحجم','Size')}</div><input type="range" min=".6" max="1.7" step=".05" value="${s.size}" oninput="tsSet('size',+this.value,1)">`;
 }else h=`<div class="tsw">${TS_EMO.map(e=>`<button onclick="tsEmo('${e}')">${e}</button>`).join('')}</div>`;
 $('tsPanel').innerHTML=h;
}
function tsClose(){TSE.classList.remove('show');tsx=null}
$('tsClose').onclick=tsClose;
$('tsT').addEventListener('input',e=>{if(!tsx)return;tsx.txt=e.target.value;e.target.style.height='auto';e.target.style.height=Math.min(96,e.target.scrollHeight)+'px';tsRender()});
$('tsGo').onclick=async()=>{
 if(!tsx||!tsx.txt.trim())return toast(T('اكتب نص القصة الأول','Write your story first'));
 const cv=$('tsCv');tsDraw(cv);
 const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.9));
 tsClose();
 await publishStoryItem({blob,isVid:false,ext:'jpg',type:'image/jpeg',caption:''});
};
window.textStory=function(){
 tsx={txt:'',bg:0,img:null,font:0,sty:0,al:'center',col:'#ffffff',size:1,tab:'bg'};
 $('tsTitle').textContent=T('قصة نصية','Text story');$('tsT').placeholder=T('اكتب قصتك هنا...','Write your story here...');$('tsT').value='';$('tsT').style.height='';

/* قائمة الإرفاق */
const _ms=mediaSheet;
mediaSheet=function(target){
 if(target!=='chat'&&target!=='story')return _ms(target);
 pickTarget=target;pickFriend=currentFriend;const ch=target==='chat';
 openModal(`<h2>${ch?T('إرسال','Send'):T('إضافة قصة','Add story')}</h2><div class="sheet"><button class="sheetbtn" onclick="closeModal();pickGallery('${target}')">${IC.image}<span>${T('من المعرض','Gallery')}</span></button><button class="sheetbtn" onclick="closeModal();openCameraFor('${target}')">${IC.cam}<span>${T('الكاميرا','Camera')}</span></button>${ch?`<button class="sheetbtn" onclick="closeModal();pickFile()">${IC.file}<span>${T('ملف','File')}</span></button>`:`<button class="sheetbtn" onclick="closeModal();textStory()">${IC.text}<span>${T('نص','Text')}</span></button>`}</div><div class="modalactions"><button class="btn secondary" onclick="closeModal()">${esc(t('cancel'))}</button></div>`);
};

/* ---------- 4) حساب SAHBY الرسمي (رسالة ترحيب كأنها من شخص عادي) ---------- */
const SYS_ID='sys:sahby',SKEY=()=>'sahby_sys_'+me.id,sget=()=>me?LSget(SKEY(),null):null;
const MK='\u2063',BADGE='<svg class="vb" viewBox="0 0 24 24" role="img" aria-label="verified"><path fill="#1d9bf0" d="M12 1.5l2.6 1.7 3.1-.3 1.2 2.9 2.7 1.5-.6 3.1 1.1 2.9-2.1 2.3-.3 3.1-3 .9L12 22.5l-2.8-1.4-3-.9-.3-3.1-2.1-2.3 1.1-2.9-.6-3.1 2.7-1.5 1.2-2.9 3.1.3z"/><path d="M8 12.2l2.7 2.7 5.5-5.5" stroke="#fff" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const logoUri=(()=>{try{
 const sv=document.querySelector('#splash .sp-logo');if(!sv)return '';
 const inner=sv.innerHTML.replace(/<ellipse[^>]*>(<\/ellipse>)?/,'');
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240"><defs><linearGradient id="bgx" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1d6e"/><stop offset="1" stop-color="#6d3ee0"/></linearGradient></defs><rect width="240" height="240" fill="url(#bgx)"/><g transform="translate(30 20) scale(.82)">${inner}</g></svg>`;
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);

<script>
(function(){
const $=id=>document.getElementById(id);
const T=(a,e)=>(typeof lang!=='undefined'&&lang==='ar')?a:e;

/* ---- Twemoji helpers ---- */
function twParse(root){
  if(typeof twemoji==='undefined'||!root)return;
  try{
    twemoji.parse(root,{
      folder:'svg',ext:'.svg',
      base:'https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/',
      className:'emoji'
    });
  }catch(e){}
}
function twStr(s){
  if(typeof twemoji==='undefined')return s;
  try{
    return twemoji.parse(String(s),{
      folder:'svg',ext:'.svg',
      base:'https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/',
      className:'emoji'
    });
  }catch(e){return s}
}

/* Observe chat bubbles for new messages */
const mo=new MutationObserver(ms=>{
  ms.forEach(m=>m.addedNodes.forEach(n=>{
    if(n.nodeType===1&&!/^(SCRIPT|STYLE)$/.test(n.tagName))twParse(n);
  }));
});
const bootMo=()=>{
  mo.observe(document.body,{childList:true,subtree:true});
  twParse(document.body);
};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootMo);else setTimeout(bootMo,800);

 {id:'hands',icon:'👍',list:'👍 👎 👊 ✊ 🤛 🤜 👏 🙌 👐 🤲 🤝 🙏 ✍️ 💅 🤳 💪 🦾 🦵 🦶 👂 👃 🧠 👀 👁️ 👅 👄 💋 💘 💝 💖 💗 💓 💞 💕 💟 ❣️ 💔 ❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💯 💢 💥 💫 💦 💨 🕳️ 💣 💬 💭 💤'.split(' ')},
 {id:'people',icon:'👤',list:'👋 🤚 🖐️ ✋ 🖖 👌 🤌 🤏 ✌️ 🤞 🤟 🤘 🤙 👈 👉 👆 🖕 👇 ☝️ 🫵 👶 👧 🧒 👦 👩 🧑 👨 👵 🧓 👴 👮 👷 💂 🕵️ 👩‍⚕️ 👨‍⚕️ 👩‍🍳 👨‍🍳 👩‍🎓 👨‍🎓 👩‍💻 👨‍💻 👩‍🎨 👨‍🎨 👮‍♀️ 👮‍♂️ 👰 🤵 👸 🤴 🦸 🦹 🎅 🤶 🧙 🧝 🧛 🧞 🧜 🧚 👼 🤰 🙇 💁 🙅 🙆 🙋 🤦 🤷'.split(' ')},
 {id:'nature',icon:'🌿',list:'🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🙈 🙉 🙊 🐒 🐔 🐧 🐦 🐤 🦆 🦅 🦉 🦇 🐺 🐗 🐴 🦄 🐝 🐛 🦋 🐌 🐞 🐜 🦟 🦗 🕷️ 🦂 🐢 🐍 🦎 🦖 🦕 🐙 🦑 🦐 🦞 🦀 🐡 🐠 🐟 🐬 🐳 🐋 🦈 🐊 🐅 🐆 🦓 🦍 🐘 🦏 🐪 🦒 🐄 🐕 🐈 🪶 🐓 🦃 🦚 🦜 🦢 🦩 🐇 🦝 🦨 🦔 🐉 🐲 🌵 🎄 🌲 🌳 🌴 🌱 🌿 ☘️ 🍀 🍃 🍂 🍁 🍄 🐚 🌾 💐 🌷 🌹 🥀 🌺 🌸 🌼 🌻 🌞 🌝 🌛 🌜 🌚 🌕 🌙 🌎 🌍 🌏 ⭐ 🌟 ✨ ⚡ 🔥 🌈 ☀️ ⛅ 🌧️ ⛈️ ❄️ ☃️ ⛄ 💨 💧 💦 ☔ 🌊'.split(' ')},
 {id:'food',icon:'🍕',list:'🍎 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🫐 🍈 🍒 🍑 🥭 🍍 🥥 🥝 🍅 🍆 🥑 🥦 🥬 🥒 🌶️ 🌽 🥕 🧄 🧅 🥔 🍠 🥐 🥯 🍞 🥖 🥨 🧀 🥚 🍳 🥞 🧇 🥓 🥩 🍗 🍖 🌭 🍔 🍟 🍕 🥪 🥙 🌮 🌯 🥗 🍝 🍜 🍲 🍛 🍣 🍱 🥟 🍤 🍙 🍚 🍘 🍥 🍧 🍨 🍦 🥧 🧁 🍰 🎂 🍮 🍭 🍬 🍫 🍿 🍩 🍪 🥜 🍯 🥛 ☕ 🍵 🍶 🍺 🍻 🥂 🍷 🥃 🍸 🍹 🍾 🧊 🥄 🍴 🍽️'.split(' ')},
 {id:'travel',icon:'✈️',list:'⚽ 🏀 🏈 ⚾ 🎾 🏐 🏉 🎱 🏓 🏸 🏒 🥅 ⛳ 🏹 🎣 🥊 🥋 🛹 ⛸️ 🎿 🏂 🏋️ 🤸 🧘 🏄 🏊 🚴 🏆 🥇 🥈 🥉 🏅 🎫 🎤 🎧 🎼 🎹 🥁 🎷 🎺 🎸 🎻 🎲 ♟️ 🎯 🎮 🎰 🧩 🚗 🚕 🚙 🚌 🏎️ 🚓 🚑 🚒 🚚 🚲 🛵 🏍️ ✈️ 🚀 🛸 🚁 ⛵ 🚢 🏠 🏡 🏢 🏥 🏦 🏨 🏫 ⛪ 🕌 🛕 🗽 🗼 🏰 🏯 ⛺ 🌋 ⛰️ 🏕️ 🌅 🌄 🌠 🎇 🎆 🏙️ 🌃 🌌 🌉'.split(' ')},
 {id:'objects',icon:'💡',list:'⌚ 📱 💻 ⌨️ 🖥️ 🖨️ 🕹️ 📷 📸 📹 🎥 📞 ☎️ 📺 📻 🧭 ⏱️ ⏰ ⌛ 📡 🔋 🔌 💡 🔦 🕯️ 💸 💵 💴 💶 💷 💰 💳 💎 🔧 🔨 🛠️ 🧲 💊 💉 🩺 🧹 🛒 🎁 🎈 🎀 🎉 🎊 ✉️ 📧 📦 📋 📁 📅 📌 📍 ✂️ ✏️ 🔍 🔒 🔓 🔑'.split(' ')},
 {id:'symbols',icon:'💯',list:'❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❣️ 💕 💞 💓 💗 💖 💘 💝 💟 ☮️ ✝️ ☪️ 🕉️ ✡️ 🔯 ☯️ ⚛️ ☢️ ☣️ 💯 💢 💥 💫 💦 💤 ✅ ❌ ⭕ ❗ ❓ ❕ ❔ ‼️ ⁉️ 💲 ✖️ ➕ ➖ ➗ ♻️ 🔖 🔔 🔕 🔇 🔈 🔉 🔊 🎵 🎶 🔴 🟠 🟡 🟢 🔵 🟣 ⚫ ⚪ 🟤 🔶 🔷 🔸 🔹'.split(' ')}
];

let epOpen=false,epCat=0;
const chatPanel=$('chatPanel');
const epEl=document.createElement('div');
epEl.id='emojiPanel';
epEl.innerHTML=`<div class="ep-tabs" id="epTabs"></div><div class="ep-grid" id="epGrid"></div>`;
// Insert AFTER composer so it sits below the input bar
const form=$('messageForm');
if(form&&form.parentNode){
  form.parentNode.insertBefore(epEl, form.nextSibling);
}else if(chatPanel){
  chatPanel.appendChild(epEl);
}else{
  document.body.appendChild(epEl);
}

function renderEpTabs(){
  $('epTabs').innerHTML=EP_CATS.map((c,i)=>`<button type="button" class="ep-tab ${i===epCat?'on':''}" data-i="${i}" aria-label="${c.id}">${c.icon}</button>`).join('')+`<button type="button" class="ep-ctl" id="epKb" aria-label="keyboard">⌨️</button><button type="button" class="ep-ctl" id="epX" aria-label="close">✖️</button>`;
  twParse($('epTabs'));
}
function renderEpGrid(){
  const list=EP_CATS[epCat].list.filter(Boolean);
  $('epGrid').innerHTML=list.map(e=>`<button type="button" data-e="${e}" aria-label="${e}">${e}</button>`).join('');
  twParse($('epGrid'));
}
function openEmoji(){
  if(epOpen){closeEmoji();return}
  epOpen=true;renderEpTabs();renderEpGrid();
  chatPanel?.classList.add('ep-open');
  {const i=$('messageInput');if(i){i.inputMode='none';i.blur()}}
  $('emojiBtn')?.classList.add('on');
  // scroll messages to bottom so last messages stay visible above input
  const msg=$('messages');
  if(msg)requestAnimationFrame(()=>{msg.scrollTop=msg.scrollHeight});
  if(typeof closeSheet==='function')try{closeSheet()}catch(e){}
}
function closeEmoji(){
  epOpen=false;
  chatPanel?.classList.remove('ep-open');
  {const i=$('messageInput');if(i)i.inputMode=''}
  $('emojiBtn')?.classList.remove('on');
}
window.closeEmoji=closeEmoji;window.openEmoji=openEmoji;

$('epTabs').addEventListener('click',e=>{
  const b=e.target.closest('.ep-tab');if(!b)return;
  epCat=+b.dataset.i;renderEpTabs();renderEpGrid();$('epGrid').scrollTop=0;
});
$('epGrid').addEventListener('click',e=>{
  const b=e.target.closest('button[data-e]');if(!b)return;
  // micro-interaction
  b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
  setTimeout(()=>b.classList.remove('pop'),340);
  const emo=b.dataset.e;
  const inp=$('messageInput');if(!inp||inp.disabled)return;
  const start=inp.selectionStart??inp.value.length,end=inp.selectionEnd??start;
  const v=inp.value;
  inp.value=v.slice(0,start)+emo+v.slice(end);
  const pos=start+emo.length;
  try{inp.setSelectionRange(pos,pos)}catch(_){}
  inp.dispatchEvent(new Event('input',{bubbles:true}));
  if(typeof updateComposer==='function')updateComposer();
  if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}
});

epEl.addEventListener('mousedown',e=>e.preventDefault());
epEl.addEventListener('click',e=>{const c=e.target.closest('.ep-ctl');if(!c)return;closeEmoji();if(c.id==='epKb')setTimeout(()=>$('messageInput')?.focus(),30)});
$('messageInput')?.addEventListener('pointerdown',()=>{if(epOpen){closeEmoji();setTimeout(()=>$('messageInput').focus(),30)}});
const eb=$('emojiBtn');
if(eb){
  const smileSvg=(typeof S==='function')
    ?S('<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01"/><path d="M15 9h.01"/>')
    :'😊';
  eb.innerHTML=smileSvg;
  setTimeout(()=>{if(typeof IS!=='undefined'&&IS.smile)eb.innerHTML=IS.smile},600);
  eb.onclick=e=>{e.preventDefault();e.stopPropagation();openEmoji()};
}

// close on outside / back / other UI
document.addEventListener('click',e=>{
  if(!epOpen)return;
  if(!e.target.isConnected||e.composedPath().some(n=>n.id==='emojiPanel'||n.id==='emojiBtn'||n.id==='messageInput'))return;
  closeEmoji();
});
$('backBtn')?.addEventListener('click',()=>closeEmoji());
const _ms0=window.mediaSheet;
if(typeof _ms0==='function')window.mediaSheet=function(){closeEmoji();return _ms0.apply(this,arguments)};

/* ========== Telegram-style voice UI ========== */
if(form){
  const vrec=document.createElement('div');
  vrec.className='vrec';
  vrec.innerHTML=`<div class="vrec-bar" id="vrecBar"><i class="vrec-dot"></i><span class="vrec-time" id="vrecTime">0:00</span><div class="vrec-hint"><span class="chev">${document.documentElement.dir==='rtl'?'›':'‹'}</span><span id="vrecHint">${T('السحب للإلغاء','Slide to cancel')}</span></div></div>`;
  form.insertBefore(vrec, form.firstChild);

  const vlocked=document.createElement('div');
  vlocked.className='vrec-locked';
  vlocked.innerHTML=`<button type="button" class="vrec-trash-btn" id="vrecTrash" aria-label="cancel"></button><div class="vrec-bar"><i class="vrec-dot"></i><span class="vrec-time" id="vrecTime2">0:00</span><div class="vrec-hint" style="justify-content:flex-start;padding-inline-start:6px"><span>${T('جارٍ التسجيل...','Recording...')}</span></div></div><button type="button" class="vrec-send-btn" id="vrecSend" aria-label="send"></button>`;
  form.insertBefore(vlocked, form.firstChild);

  const lockZone=document.createElement('div');
  lockZone.className='vrec-lock-zone';lockZone.id='vrecLock';
  form.style.position='relative';
  form.appendChild(lockZone);

  setTimeout(()=>{
    if(typeof IC==='undefined')return;
    const trash=$('vrecTrash'),send=$('vrecSend'),lk=$('vrecLock');
    if(trash)trash.innerHTML=IC.trash||'';
    if(send)send.innerHTML=IC.send||'';
    if(lk)lk.innerHTML=IC.lock||'';
  },400);

  $('vrecTrash')?.addEventListener('click',()=>{if(typeof cancelRecording==='function')cancelRecording()});
  $('vrecSend')?.addEventListener('click',()=>{if(typeof stopRecording==='function')stopRecording(true)});

  const mic=$('micBtn');if(mic)mic.classList.add('vrec-mic');

  const _setRecUi=typeof setRecUi==='function'?setRecUi:null;
  if(_setRecUi)window.setRecUi=function(on){
    _setRecUi(on);
    form.classList.toggle('recing',on);
    form.classList.remove('locked');
    const lz=$('vrecLock');
    if(lz){lz.classList.remove('show','hot');lz.style.opacity=''}
    if(on){
      closeEmoji();
      $('vrecTime').textContent='0:00';$('vrecTime2').textContent='0:00';
      const bar=$('vrecBar');if(bar){bar.style.transform='';bar.style.opacity='';bar.classList.remove('pull')}
      setTimeout(()=>{if(typeof rec!=='undefined'&&rec&&!rec.locked)$('vrecLock')?.classList.add('show')},200);
    }
  };

  const _lockRec=typeof lockRec==='function'?lockRec:null;
  if(_lockRec)window.lockRec=function(){
    _lockRec();
    form.classList.add('locked');
    $('vrecLock')?.classList.remove('show','hot');
    if(mic&&typeof IC!=='undefined'){mic.classList.add('lock');mic.innerHTML=IC.send}
    const t=$('recTime')?.textContent||'0:00';
    if($('vrecTime2'))$('vrecTime2').textContent=t;
  };

  setInterval(()=>{
    if(typeof rec==='undefined'||!rec)return;
    const t=$('recTime')?.textContent;if(!t)return;
    if($('vrecTime'))$('vrecTime').textContent=t;
    if($('vrecTime2'))$('vrecTime2').textContent=t;
  },100);

  let micStart=null;
  mic?.addEventListener('pointerdown',e=>{
    if(e.button>0||(typeof rec!=='undefined'&&rec))return;
    micStart={x:e.clientX,y:e.clientY};
  },{capture:true});

  window.addEventListener('pointermove',e=>{
    if(!micStart||typeof rec==='undefined'||!rec||rec.locked)return;
    const sgn=document.documentElement.dir==='rtl'?1:-1;
    const dx=(e.clientX-micStart.x)*sgn;
    const dy=micStart.y-e.clientY;
    const bar=$('vrecBar');
    const pull=Math.max(0,Math.min(160,dx));
    if(bar){
      bar.style.transform=`translateX(${pull*sgn}px)`;
      bar.style.opacity=String(Math.max(0.25,1-pull/140));
      bar.classList.toggle('pull',pull>40);
    }
    const lz=$('vrecLock');
    if(lz){
      lz.classList.add('show');
      const hot=dy>55;lz.classList.toggle('hot',hot);
      lz.style.transform=hot?`translateY(${Math.min(0,-(dy-55)*0.3)}px)`:'';
    }
    if(dx>110){
      micStart=null;
      if(bar){bar.style.transform='';bar.style.opacity='';bar.classList.remove('pull')}
      if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}
      if(typeof cancelRecording==='function')cancelRecording();return;
    }
    if(dy>95){
      micStart=null;
      if(bar){bar.style.transform='';bar.style.opacity=''}
      if(navigator.vibrate)try{navigator.vibrate(20)}catch(_){}
      if(typeof lockRec==='function')lockRec();
    }
  },{capture:true});
  window.addEventListener('pointerup',()=>{micStart=null},{capture:true});
  window.addEventListener('pointercancel',()=>{micStart=null},{capture:true});

  const _start=window.startRecording;
  if(typeof _start==='function')window.startRecording=async function(){
    closeEmoji();return _start.apply(this,arguments);
  };
}

console.log('[Sahby v10] emoji docked + Twemoji + voice UI');
})();
</script>

<script id="v11">
(function(){
const $=id=>document.getElementById(id),A=()=>typeof lang!=='undefined'&&lang==='ar',T=(a,e)=>A()?a:e;
/* ---- Ripple ---- */
const SEL='button,.item,.sitem,.ritem,.act,.navbtn,.sheetbtn,.ibtn,.btn,.sring,.invite,.opt';
document.addEventListener('pointerdown',e=>{
 const t=e.target.closest&&e.target.closest(SEL);if(!t||t.disabled)return;
 const r=t.getBoundingClientRect();if(r.width>700||r.height>500||!r.width)return;
 const h=document.createElement('span');h.className='rpl-h';
 h.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;border-radius:${getComputedStyle(t).borderRadius}`;
 const d=Math.max(r.width,r.height)*2.2,i=document.createElement('i');
 i.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
 h.appendChild(i);document.body.appendChild(h);setTimeout(()=>h.remove(),600);
},{passive:true,capture:true});
/* ---- Referral ---- */
const UU=/^[0-9a-f-]{36}$/i;
try{const q=new URLSearchParams(location.search).get('ref');if(q&&UU.test(q))localStorage.setItem('sahby_ref',q)}catch(e){}
const link=()=>location.href.split(/[?#]/)[0]+'?ref='+me.id;
const msg=()=>T('انضم لي على صحبي 💬 دردشة سريعة وآمنة مع أصحابك','Join me on Sahby 💬 fast & secure chat with friends');
async function claim(){
 let r;try{r=localStorage.getItem('sahby_ref')}catch(e){}
 if(!r||!me||r===me.id)return;
 try{const x=await db.rpc('claim_referral',{ref_id:r});if(!x.error||/duplicate|already/i.test(x.error.message))localStorage.removeItem('sahby_ref')}catch(e){}
}
const _ep=ensureProfile;ensureProfile=async function(){const r=await _ep.apply(this,arguments);claim();return r};
async function count(){
 try{const r=await db.from('referrals').select('id',{count:'exact',head:true}).eq('referrer_id',me.id);
  const p=await db.from('profiles').select('verified').eq('id',me.id).maybeSingle();
  if(p.data&&myProfile)myProfile.verified=p.data.verified;return r.count||0}catch(e){return 0}
}
window.openInvite=async function(){

${pwIn('sP',T('كلمة السر','Password'),'new-password')}<div class="pwm" id="pwm"><i></i><i></i><i></i><i></i></div><div class="a-h" id="pwh"></div>

 const rm=e.target.closest('[data-rm]');if(rm){e.stopPropagation();sv(ld().filter(x=>x.u!==rm.dataset.rm));return cards()}
 const c=e.target.closest('.sc');if(c){$('lU').value=c.dataset.u;$('lP').focus()}});
let tm=0,okU=false;

 if(!u){h.textContent='';h.className='a-h';return upd()}
 const er=uErr(u);if(er){h.textContent=er;h.className='a-h bad';return upd()}
 h.textContent=T('جاري التحقق...','Checking...');h.className='a-h';
 tm=setTimeout(async()=>{try{const r=await db.rpc('username_available',{u});
  if(r.error)throw r.error;if(r.data===false){h.textContent=T('اسم المستخدم مستخدم قبل كده','Username already taken');h.className='a-h bad'}else{okU=true;h.textContent=T('متاح ✓','Available ✓');h.className='a-h ok'}}
  catch(x){okU=true;h.textContent=T('تمام (هيتأكد وقت الإنشاء)','OK (verified on sign-up)');h.className='a-h ok'}upd()},400);upd()}

 const miss=NM.filter((_,i)=>!r.c[i]);if(p.length<8)miss.push(T('8 خانات','8+ chars'));
 $('pwh').textContent=!p?'':miss.length?T('ينقص: ','Missing: ')+miss.join('، '):T('كلمة سر قوية ✓','Strong password ✓');$('pwh').className='a-h '+(p&&!miss.length?'ok':'');upd()}

function finish(u){el.classList.add('out');setTimeout(()=>{el.style.display='none'},450);done&&done(u)}

 if(!u||!p)return er.textContent=T('اكتب اسم المستخدم وكلمة السر','Enter username and password');
 busy(b,true,T('جاري الدخول...','Logging in...'));

 catch(x){er.textContent=/banned/i.test(x.message)?T('هذا الحساب موقوف من الإدارة','This account is suspended'):/invalid|credentials/i.test(x.message)?T('اسم المستخدم أو كلمة السر غلط','Wrong username or password'):x.message;busy(b,false,T('تسجيل الدخول','Log in'))}};

 catch(x){er.textContent=/registered|exists/i.test(x.message)?T('اسم المستخدم مستخدم قبل كده','Username already taken'):x.message;busy(b,false,T('إنشاء الحساب','Sign up'))}};

const EMO=['❤️','😂','😮','😢','👏','🔥'];
function stPause(){
 if(!sv||sv.paused)return;sv.paused=true;clearTimeout(sv.timer);
 sv.elapsed=(sv.elapsed||0)+(Date.now()-(sv.t0||Date.now()));
 const r=$('storyView');if(r)r.classList.add('paused');
 const v=$('svVid');if(v)v.pause();
}
function stResume(){
 if(!sv||!sv.paused)return;sv.paused=false;sv.t0=Date.now();
 const r=$('storyView');if(r)r.classList.remove('paused');
 const v=$('svVid');
 if(v){const p=v.play();if(p&&p.catch)p.catch(()=>{})}
 else sv.timer=setTimeout(nextStory,Math.max(400,5000-(sv.elapsed||0)));
}
function stFly(e){
 const r=$('storyView');if(!r)return;
 const d=document.createElement('div');d.className='sr-fly';d.textContent=e;r.appendChild(d);
 try{if(window.twemoji)twemoji.parse(d,{folder:'svg',ext:'.svg'})}catch(_){}
 setTimeout(()=>d.remove(),1300);
}
async function stSend(s,text,emoji){
 if(emoji)stFly(emoji);
 const ok=await sendMessage({kind:'text',media_url:s.media_url,content:'↩️ '+text},s.user_id);
 if(ok)toast(T('تم إرسال ردّك ✓','Reply sent ✓'));
 return ok;
}
function stAfter(){
 const root=$('storyView');if(!sv||!root)return;
 sv.paused=false;sv.elapsed=0;sv.t0=Date.now();
 root.classList.remove('paused','hasreply');
 const s=sv.list[sv.i];
 if(!s||s.user_id===me.id)return;
 const owner=friends.find(f=>f.id===s.user_id);if(!owner||owner.isSys)return;
 root.classList.add('hasreply');
 const nm=profileName(owner);
 root.insertAdjacentHTML('beforeend',`<div class="srp" id="srp"><div class="srp-emo">${EMO.map(e=>`<button type="button" data-e="${e}" aria-label="${e}">${e}</button>`).join('')}</div><form class="srp-f" id="srpF" autocomplete="off"><input id="srpI" maxlength="500" placeholder="${E(T('الرد على '+nm+'...','Reply to '+nm+'...'))}" enterkeyhint="send"><button class="srp-s" id="srpS" type="submit" disabled aria-label="${T('إرسال','Send')}">${IC.send}</button></form></div>`);
 try{if(window.twemoji)twemoji.parse($('srp'),{folder:'svg',ext:'.svg'})}catch(_){}
 const inp=$('srpI'),btn=$('srpS');
 inp.addEventListener('input',()=>{btn.disabled=!inp.value.trim()});
 inp.addEventListener('focus',stPause);
 inp.addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==inp&&!inp.value.trim())stResume()},160));
 $('srp').addEventListener('click',e=>{const b=e.target.closest('button[data-e]');if(!b)return;e.stopPropagation();stSend(s,b.dataset.e,b.dataset.e)});
 $('srpF').addEventListener('submit',async e=>{
  e.preventDefault();const v=inp.value.trim();if(!v)return;
  btn.disabled=true;inp.disabled=true;
  const ok=await stSend(s,v);
  inp.disabled=false;
  if(ok){inp.value='';btn.disabled=true;inp.blur();stResume()}else btn.disabled=false;
 });
}
guard('story',()=>{
 const _ss=showStory;
 showStory=function(){_ss.apply(this,arguments);guard('story-reply',stAfter)};
 const _cs=closeStories;
 closeStories=function(){const r=$('storyView');if(r){r.style.bottom='';r.classList.remove('hasreply','paused')}return _cs.apply(this,arguments)};
 if(window.visualViewport){
  const vv=window.visualViewport,f=()=>{const r=$('storyView');if(!r||r.classList.contains('hidden'))return;r.style.bottom=Math.max(0,innerHeight-vv.height-vv.offsetTop)+'px'};
  vv.addEventListener('resize',f);vv.addEventListener('scroll',f);
 }
 /* كارت الرد داخل الشات */
 const isSR=m=>!!m&&m.kind==='text'&&!!m.media_url&&/^↩️/.test(m.content||'');
 const _b=bubble;
 bubble=function(m,map){
  if(!isSR(m))return _b(m,map);
  const u=safeUrl(m.media_url),txt=m.content.replace(/^↩️\s*/,''),mine=m.sender_id===me.id;
  const thumb=!u?'':/\.(mp4|webm|mov|m4v)(\?|$)/i.test(m.media_url)?`<video src="${u}#t=0.1" muted playsinline preload="metadata"></video>`:`<img src="${u}" alt="" loading="lazy">`;
  const who=mine?T('ردّك على قصة','Your reply to a story'):T('ردّ على قصتك','Replied to your story');
  const card=`<div class="sr-card"><div class="sr-th">${thumb}</div><div class="sr-tx"><b>${who}</b><small>${T('قصة','Story')}</small></div></div><div class="srtxt">${E(txt)}</div>`;
  return _b({...m,content:'\u200b',media_url:null},map).replace('\u200b',card);
 };
});

let rp=null;
window.openReport=function(){

 rp={id:f.id,reason:'',text:'',block:false,busy:false};
 sheet(`<div class="grab"></div><div class="rp-wrap" id="rpW">
 <div class="rp-h"><div class="rp-ic">${I14.flag}</div><div><h3>${T('إبلاغ عن','Report')} ${E(profileName(f))}</h3><p>${T('اختار سبب البلاغ وهيوصل لفريق الإدارة بسرية.','Pick a reason. It goes to the admin team in confidence.')}</p></div></div>

 <div class="rp-note">${I14.info}<span>${T('هيتم إرفاق آخر 15 رسالة من المحادثة مع بيانات حسابك وحساب الطرف التاني، وبيشوفها فريق الإدارة بس.','The last 15 messages of this chat, plus both accounts’ details, are attached. Only the admin team can see them.')}</span></div>

 <button class="btn big rp-go" id="rpGo" disabled>${T('إرسال البلاغ','Send report')}</button>
 <button class="btn secondary big" style="margin-top:8px" onclick="closeSheet()">${T('إلغاء','Cancel')}</button></div>`);
 try{if(window.twemoji)twemoji.parse($('rpL'),{folder:'svg',ext:'.svg'})}catch(_){}
 const upd=()=>{const ok=rp.reason&&(rp.reason!=='other'||rp.text.trim().length>=3);$('rpGo').disabled=!ok||rp.busy};
 $('rpL').onclick=e=>{
  const b=e.target.closest('.rp-r');if(!b)return;
  rp.reason=b.dataset.r;$('rpL').querySelectorAll('.rp-r').forEach(x=>x.classList.toggle('on',x===b));

 };
 $('rpTx').oninput=e=>{rp.text=e.target.value;$('rpCnt').textContent=rp.text.length;upd()};
 const bl=$('rpBl'),tgb=()=>{rp.block=bl.classList.toggle('on');bl.setAttribute('aria-checked',rp.block)};

async function rpSubmit(){
 if(!rp||rp.busy||!rp.reason)return;
 if(offlineMode||!navigator.onLine)return toast(tx('needNet'));
 rp.busy=true;const go=$('rpGo');go.disabled=true;go.textContent=T('جاري الإرسال...','Sending...');
 try{
  const r=await db.rpc('submit_report',{p_reported:rp.id,p_reason:rp.reason,p_text:rp.reason==='other'?rp.text.trim():null});
  if(r.error)throw r.error;
  const st=r.data;
  if(st==='rate'){rp.busy=false;go.disabled=false;go.textContent=T('إرسال البلاغ','Send report');return toast(T('بلاغات كتير في وقت قصير. جرّب بعد شوية.','Too many reports. Try again later.'))}
  if(st!=='ok'&&st!=='dup'){rp.busy=false;go.disabled=false;go.textContent=T('إرسال البلاغ','Send report');return toast(T('تعذّر إرسال البلاغ','Could not send the report'))}
  const doBl=rp.block,id=rp.id;
  $('rpW').innerHTML=`<div class="rp-done"><div class="rp-ok">${IC.check}</div><h3>${st==='dup'?T('بلّغت عنه قبل كده','Already reported'):T('تم إرسال البلاغ','Report sent')}</h3><p>${st==='dup'?T('بلاغك السابق لسه عند الإدارة وهتراجعه قريب.','Your earlier report is still with the admins and will be reviewed soon.'):T('شكراً لمساعدتك في إبقاء صحبي مكان آمن. فريق الإدارة هيراجع البلاغ والمحادثة المرفقة.','Thanks for helping keep Sahby safe. The admin team will review the report and the attached messages.')}</p><button class="btn big" id="rpOk">${T('تم','Done')}</button></div>`;
  $('rpOk').onclick=()=>{closeSheet();if(doBl&&!blockedIds.has(id))doBlock(id)};
 }catch(e){
  rp.busy=false;go.disabled=false;go.textContent=T('إرسال البلاغ','Send report');
  toast(sqlMissing(e.message)?NEED_SQL:(e.message||T('تعذّر الإرسال','Failed to send')));
 }
}

let tmpMap={},tmpSig='',tmpAt=0,tmpOff=false,purgeAt=0;
const tmpKey=()=>'sahby_tmp_'+(me&&me.id);
const tmpLabel=s=>({86400:T('كل يوم','Every day'),2592000:T('كل شهر','Every month'),7776000:T('كل 3 أشهر','Every 3 months')}[s]||T('متوقفة','Off'));
const tmpDur=s=>({86400:T('يوم','1 day'),2592000:T('شهر','1 month'),7776000:T('3 أشهر','3 months')}[s]||'');
const tmpExpired=(m,fid)=>{const c=tmpMap[fid];if(!c||!m.created_at)return false;const ts=+new Date(m.created_at);return ts>=c.since&&Date.now()-ts>c.secs*1000};

async function loadChatSettings(force){
 if(!db||!me||tmpOff)return;
 if(!tmpSig&&!Object.keys(tmpMap).length){const c=LSget(tmpKey(),null);if(c){tmpMap=c;tmpSig=JSON.stringify(c);tmpUi()}}
 if(offlineMode||!navigator.onLine)return;
 if(!force&&Date.now()-tmpAt<8000)return;
 tmpAt=Date.now();
 try{
  const r=await db.from('chat_settings').select('user_a,user_b,disappear_secs,set_by,updated_at').or(`user_a.eq.${me.id},user_b.eq.${me.id}`);
  if(r.error){if(sqlMissing(r.error.message))tmpOff=true;return}
  const m={};
  (r.data||[]).forEach(x=>{if(x.disappear_secs>0){const o=x.user_a===me.id?x.user_b:x.user_a;m[o]={secs:x.disappear_secs,since:+new Date(x.updated_at),by:x.set_by,at:x.updated_at}}});
  const sg=JSON.stringify(m);
  if(sg!==tmpSig){tmpSig=sg;tmpMap=m;LSset(tmpKey(),m);tmpUi();purgeNow(true)}
 }catch(e){}
}
function tmpUi(){
 try{renderList()}catch(e){}
 if(currentFriend){try{renderMessages(curRows,false)}catch(e){}}
}
async function purgeNow(force){
 if(!db||!me||offlineMode||!navigator.onLine||tmpOff||!Object.keys(tmpMap).length)return;
 if(!force&&Date.now()-purgeAt<300000)return;
 purgeAt=Date.now();
 try{await db.rpc('purge_disappearing')}catch(e){}
}

 sheet(`<div class="grab"></div><h3 class="bs-t">${T('الدردشة المؤقتة','Disappearing chat')}</h3><p class="bs-s">${T('اختار المدة اللي بعدها الرسائل تتحذف تلقائياً من عند الطرفين.','Choose how long before messages are deleted for both of you.')}</p>
 ${OPTS.map(o=>`<button class="opt tmp-opt ${o[0]===cur?'on':''}" data-s="${o[0]}"><span class="oi">${I14.timer}</span><span><b>${o[1]}</b><small>${o[2]}</small></span><span class="ck">${IC.check}</span></button>`).join('')}
 <div class="tmp-info">${I14.info}<span>${T('بتطبّق على الرسائل الجديدة بس. أي طرف يقدر يغيّرها والتغيير بيظهر للاتنين. ممكن أي حد ياخد لقطة شاشة أو يحفظ الرسائل قبل ما تتحذف.','Applies to new messages only. Either of you can change it and both see the change. Anyone can still screenshot or save messages before they are deleted.')}</span></div>
 <button class="btn secondary big" onclick="closeSheet()">${T('إغلاق','Close')}</button>`);
 $('bsheet').querySelectorAll('.tmp-opt').forEach(b=>b.onclick=()=>setTmp(+b.dataset.s));
};
async function setTmp(secs){
 const f=currentFriend;if(!f)return;closeSheet();
 if(offlineMode||!navigator.onLine)return toast(tx('needNet'));
 if(((tmpMap[f.id]||{}).secs||0)===secs)return;
 try{
  const r=await db.rpc('set_disappearing',{p_friend:f.id,p_secs:secs});
  if(r.error)throw r.error;
  if(r.data!=='ok')throw Error(T('تعذّر تغيير الإعداد','Could not change the setting'));
  await loadChatSettings(true);
  toast(secs?T('تم تفعيل الدردشة المؤقتة ⏳','Disappearing chat enabled ⏳'):T('تم إيقاف الدردشة المؤقتة','Disappearing chat turned off'));
 }catch(e){toast(sqlMissing(e.message)?NEED_SQL:e.message)}
}

guard('tmp-hooks',()=>{
 const _rm=renderMessages;
 renderMessages=function(rows,force){
  const fid=currentFriend&&currentFriend.id;
  if(fid&&tmpMap[fid])rows=rows.filter(m=>!tmpExpired(m,fid));
  const r=_rm.call(this,rows,force);
  guard('tmp-sync',syncTmpUi);
  return r;
 };
 const _rl=renderList;
 renderList=function(){const r=_rl.apply(this,arguments);guard('tmp-list',tmpListBadges);return r};
 const _acs=applyChatState;
 applyChatState=function(){const r=_acs.apply(this,arguments);syncMore();guard('tmp-sync',syncTmpUi);return r};
 setInterval(()=>{
  if(currentFriend&&tmpMap[currentFriend.id])guard('tmp-tick',()=>renderMessages(curRows,false));
  purgeNow(false);
 },30000);
 try{
  if(db.channel)db.channel('sahby-chat-settings').on('postgres_changes',{event:'*',schema:'public',table:'chat_settings'},()=>loadChatSettings(true)).subscribe();
 }catch(e){}
});

/* ============================================================
   6) لوحة الأدمن: تبويب البلاغات
   ============================================================ */
let RPT=[],rpFilter='open';
const RC_COL={abuse:'#d6455d',voice_spam:'#e0852b',inappropriate:'#b84fd1',scam:'#c9302c',bullying:'#3b7ddd',other:'#5b6b7a'};
const ST_L=()=>({open:T('جديد','New'),resolved:T('تمت المعالجة','Resolved'),dismissed:T('تم التجاهل','Dismissed')});
const ST_C={open:'#e11d48',resolved:'#16a34a',dismissed:'#64748b'};
function admTabs(){
 const d=$('adm');if(!d||$('admT'))return;
 const s=$('admS');if(!s)return;
 s.insertAdjacentHTML('beforebegin',`<div class="adm-tabs" id="admT"><button type="button" class="on" data-t="u">${T('المستخدمين','Users')}</button><button type="button" data-t="r">${T('البلاغات','Reports')}<i id="admRn"></i></button></div>`);
 const L=$('admL');L.insertAdjacentHTML('afterend','<div id="admR" class="hidden"></div>');
 const show=t=>{
  $('admT').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ['admS','admF','admQ','admL'].forEach(i=>{const e=$(i);if(e)e.style.display=t==='u'?'':'none'});
  $('admR').classList.toggle('hidden',t!=='r');
  if(t==='r')admReports();
 };
 $('admT').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)};
 admReports(true);
}
async function admReports(silent){
 const box=$('admR');if(!box)return;
 if(!silent)box.innerHTML=`<div class="empty">${T('جاري التحميل...','Loading...')}</div>`;
 try{
  const r=await db.rpc('admin_list_reports');if(r.error)throw r.error;
  RPT=Array.isArray(r.data)?r.data:[];
  const n=RPT.filter(x=>x.status==='open').length,b=$('admRn');if(b)b.textContent=n?String(n):'';
  drawReports();
 }catch(e){
  if(!silent)box.innerHTML=`<div class="empty">${E(e.message)}<br>${NEED_SQL}</div>`;
 }
}
function drawReports(){
 const box=$('admR');if(!box)return;
 const L=ST_L(),list=RPT.filter(x=>rpFilter==='all'||x.status===rpFilter);
 const dt=x=>{try{return new Date(x).toLocaleString(T('ar-EG','en-GB'),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
 const person=(p,id)=>{p=p||{};return `<b>${E(p.name||p.username||'—')}</b><small>@${E(p.username||'')}</small>`};
 const cnt=k=>k==='all'?RPT.length:RPT.filter(x=>x.status===k).length;
 const filt=`<div class="rf">${[['open',L.open],['resolved',L.resolved],['dismissed',L.dismissed],['all',T('الكل','All')]].map(([k,n])=>`<button type="button" data-f="${k}" class="${rpFilter===k?'on':''}">${n} (${cnt(k)})</button>`).join('')}</div>`;
 const cards=list.map(x=>{
  const dtl=x.details||{},rep=dtl.reporter||{},rpd=dtl.reported||{},ms=Array.isArray(dtl.messages)?dtl.messages:[];
  const nameOf=id=>id===rep.id?(rep.name||rep.username||'?'):(rep.id!==id&&id===rpd.id?(rpd.name||rpd.username||'?'):'?');
  const msgs=ms.map(m=>{
   const isRep=m.from===rpd.id,u=m.media&&/^https:\/\//.test(m.media)?m.media:'';
   const body=u&&m.kind&&m.kind!=='text'?`<a href="${E(u)}" target="_blank" rel="noopener noreferrer">${m.kind==='image'?'🖼 '+T('صورة','Image'):m.kind==='video'?'🎬 '+T('فيديو','Video'):m.kind==='audio'?'🎤 '+T('رسالة صوتية','Voice message'):'📎'}</a>${m.content&&!['📷','🎬','🎤'].includes(m.content)?'<br>'+E(m.content):''}`:u?`<a href="${E(u)}" target="_blank" rel="noopener noreferrer">📎 ${E((m.content||'').replace(/^📎\s*/,''))}</a>`:E(m.content||'');
   return `<div class="rc-m ${isRep?'rep':'me'}"><small><span>${E(nameOf(m.from))}</span><span>${E(dt(m.at))}</span></small>${body}</div>`;
  }).join('')||`<div class="empty" style="padding:10px">${T('مفيش رسائل','No messages')}</div>`;
  return `<div class="rc ${x.status!=='open'?'closed':''}" data-id="${E(x.id)}">
  <div class="rc-top"><span class="rc-chip" style="background:${RC_COL[x.reason]||'#5b6b7a'}">${E(rLabel(x.reason))}</span><span class="rc-chip" style="background:${ST_C[x.status]||'#64748b'}">${E(L[x.status]||x.status)}</span><span class="rc-time">${E(dt(x.created_at))}</span></div>
  <div class="rc-ppl"><div class="rc-p"><span>${T('المُبلِّغ','Reporter')}</span>${person(rep)}</div><div class="rc-p"><span>${T('المُبلَّغ عنه','Reported')}</span>${person(rpd)}</div></div>
  ${x.reason_text?`<div class="rc-txt">${E(x.reason_text)}</div>`:''}
  <details><summary>${T('عرض المحادثة','View conversation')} (${ms.length})</summary><div class="rc-msgs">${msgs}</div></details>
  ${x.admin_note?`<div class="rc-txt" style="opacity:.85">📝 ${E(x.admin_note)}</div>`:''}
  <div class="rc-acts2">${x.status==='open'
   ?`<button type="button" class="btn small" data-a="resolved">${T('تمت المعالجة','Mark resolved')}</button><button type="button" class="btn secondary small" data-a="dismissed">${T('تجاهل','Dismiss')}</button><button type="button" class="btn danger small" data-a="ban">${T('إيقاف المُبلَّغ عنه','Suspend reported user')}</button>`
   :`<button type="button" class="btn secondary small" data-a="open">${T('إعادة فتح','Reopen')}</button>`}</div></div>`;
 }).join('')||`<div class="empty">${T('مفيش بلاغات هنا','No reports here')}</div>`;
 box.innerHTML=filt+cards;
 box.querySelector('.rf').onclick=e=>{const b=e.target.closest('button[data-f]');if(b){rpFilter=b.dataset.f;drawReports()}};
 box.querySelectorAll('.rc').forEach(c=>c.querySelector('.rc-acts2').onclick=e=>{const b=e.target.closest('button[data-a]');if(b)admRptAct(c.dataset.id,b.dataset.a)});
}
async function admSetReport(id,st,note){
 try{
  const r=await db.rpc('admin_set_report',{p_id:id,p_status:st,p_note:note||null});
  if(r.error)throw r.error;
  toast(T('تم','Done'));await admReports(true);
 }catch(e){toast(e.message)}
}
function admRptAct(id,a){
 const x=RPT.find(r=>r.id===id);if(!x)return;
 if(a==='ban'){
  const rpd=(x.details&&x.details.reported)||{};
  return confirmDialog({tone:'danger',icon:IC.trash,title:T('إيقاف الحساب؟','Suspend account?'),
   text:T(`حساب ${rpd.name||rpd.username||''} هيتوقف ويخرج من كل الأجهزة، وتقدر ترجّعه من تبويب المستخدمين.`,`${rpd.name||rpd.username||'This'} account will be suspended and logged out everywhere. You can restore it from the Users tab.`),
   confirmText:T('إيقاف','Suspend'),
   onConfirm:async()=>{try{const r=await db.rpc('admin_set_disabled',{uid:x.reported_id,off:true});if(r.error)throw r.error;await admSetReport(id,'resolved',T('تم إيقاف الحساب','Account suspended'))}catch(e){toast(e.message)}}});
 }
 admSetReport(id,a);
}
guard('admin',()=>{
 const _oa=window.openAdmin;
 if(typeof _oa!=='function')return;
 window.openAdmin=async function(){const r=await _oa.apply(this,arguments);guard('admin-tabs',admTabs);return r};
});

/* ============================================================
   7) ربط كل ده بدورة حياة التطبيق
   ============================================================ */
guard('refresh',()=>{
 const _ra=refreshAll;
 refreshAll=async function(){
  const r=await _ra.apply(this,arguments);
  guard('post-refresh',()=>{markDelivered();loadChatSettings();rcCheckPending();purgeNow(false)});
  return r;
 };
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)guard('vis',()=>{markDelivered();loadChatSettings(true)})});
setTimeout(()=>guard('boot',()=>{if(me){loadChatSettings(true);rcCheckPending()}}),2500);
guard('more-init',syncMore);
})();

</script>

/* ================= الإشارات (Supabase Realtime) ================= */
let myCh=null,listenId=null;const chs=new Map();
function ensureListen(){
 if(!db||!me||!db.channel)return;
 if(listenId===me.id)return;
 if(myCh){try{db.removeChannel(myCh)}catch(e){}}
 listenId=me.id;
 myCh=db.channel('sahby-call-'+me.id,{config:{broadcast:{self:false}}});

}
function peerCh(id){
 const o=chs.get(id);if(o)return o.p;

 const p=new Promise(res=>{
  let done=false;const fin=v=>{if(!done){done=true;res(v)}};
  try{ch.subscribe(st=>{if(st==='SUBSCRIBED')fin(ch);else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')fin(null)})}catch(e){fin(null)}
  setTimeout(()=>fin(null),9000);

 chs.set(id,{ch,p});return p;
}
function dropCh(id){const o=chs.get(id);if(!o)return;chs.delete(id);try{db.removeChannel(o.ch)}catch(e){}}
async function sig(to,payload){

  const ch=await peerCh(to);if(!ch){dropCh(to);return false}
  const r=await ch.send({type:'broadcast',event:'sig',payload:{...payload,from:me.id,to}});
  return r===undefined||r==='ok';
 }catch(e){dropCh(to);return false}
}
let Q=Promise.resolve();

const stopStream=s=>{try{s&&s.getTracks().forEach(t=>t.stop())}catch(e){}};

async function getMedia(video){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast(T('المتصفح ده مش بيدعم المكالمات','This browser does not support calls'));return null}

}

/* ================= بدء مكالمة ================= */
async function callTo(f,mode){
 if(!me||!f||f.isGroup||f.isSys)return;
 if(call){if(call.peer.id===f.id){call.min=false;paint()}else toast(T('انت في مكالمة بالفعل','You are already in a call'));return}
 if(blockedIds.has(f.id)){toast(T('المستخدم ده محظور','This user is blocked'));return}
 if(!friends.some(x=>x.id===f.id)){toast(T('المكالمات للأصدقاء بس','Calls are for friends only'));return}
 if((typeof offlineMode!=='undefined'&&offlineMode)||!navigator.onLine){toast(T('محتاج إنترنت عشان تكلّم','You need internet to call'));return}
 if(!window.RTCPeerConnection){toast(T('المتصفح ده مش بيدعم المكالمات','This browser does not support calls'));return}

}
function newCall(id,peer,mode,dir){return{id,peer,mode,dir,status:dir==='out'?'out':'in',ring:false,t0:Date.now(),startedAt:0,muted:false,deaf:false,cam:false,screen:false,mirror:true,swap:false,min:false,rMuted:false,rCam:mode==='video',rScreen:false,front:true,speak:false,rSpeak:false,q:0,reconn:false,reply:false}}

/* ================= استقبال الإشارات ================= */
function onSig(s){
 if(!s||!me||s.to!==me.id||!s.cid||s.from===me.id)return;
 if(s.type==='invite')return onInvite(s);
 if(!call||call.id!==s.cid||call.peer.id!==s.from)return;
 switch(s.type){
  case'ringing':if(call.dir==='out'&&call.status==='out'){call.ring=true;paint()}break;
  case'accept':if(call.dir==='out'&&call.status==='out')onAccepted(s);break;
  case'offer':onOffer(s);break;
  case'answer':onAnswer(s);break;
  case'ice':onIce(s.cand);break;
  case'state':applyState(s);break;
  case'react':if(s.emoji)floatEmoji(String(s.emoji).slice(0,4),profileName(call.peer));break;
  case'end':onRemoteEnd(s.reason);break;
 }
}
function onInvite(s){
 const fr=friends.find(x=>x.id===s.from);
 if(!fr||blockedIds.has(s.from))return;
 if(call){
  if(call.peer.id===s.from&&call.dir==='out'&&call.status==='out'){
   if(me.id<s.from)return;                     // المتصل الأصغر يكمّل، التاني بيتحوّل لمستقبل
   silentDrop();
  }else{sig(s.from,{cid:s.cid,type:'end',reason:'busy'});return}
 }

}

async function accept(){
 if(!call||call.status!=='in')return;

 if(!m){decline();return}

 qsig({type:'accept',cam:m.v});tone.ok();askNotif();paint();

}

}

function failOut(){if(!call)return;toast(T('تعذّر تأمين الاتصال. جرّب تاني','Could not secure the connection. Try again'));finish('failed',true)}
function onRemoteEnd(r){
 if(!call)return;
 if(r==='busy')toast(T('الطرف التاني في مكالمة تانية','The other person is on another call'));
 else if(r==='declined')toast(T('الطرف التاني مش فاضي دلوقتي','The other person declined'));
 const out=call.startedAt?'completed':(['declined','busy','failed','missed'].includes(r)?r:'missed');

}

/* ================= WebRTC ================= */
function mkPc(isPolite){

 pc.onicecandidate=e=>{if(pc===mine&&e.candidate)qsig({type:'ice',cand:e.candidate.toJSON()})};

  if(pc!==mine)return;
  if(e.streams&&e.streams[0])remoteStream=e.streams[0];
  else{if(!remoteStream)remoteStream=new MediaStream();remoteStream.addTrack(e.track)}
  e.track.onmute=()=>paint();e.track.onunmute=()=>paint();
  attachMedia();paint();
 };

  if(pc!==mine)return;
  try{makingOffer=true;await pc.setLocalDescription();qsig({type:'offer',sdp:sdp0(pc.localDescription),st:myState()})}
  catch(e){console.warn('neg',e)}finally{makingOffer=false}
 };

  if(pc!==mine||!call)return;const st=pc.connectionState;
  if(st==='connected'){
   clearTimeout(discT);call.reconn=false;
   if(call.status!=='connected'){call.status='connected';call.startedAt=Date.now();clearTimeout(connectT);tone.ok();startTick();startStats();wake();qsig({type:'state',...myState()});
    if(stopM2)stopM2();stopM2=meter(remoteStream,l=>{if(!call)return;const v=!call.rMuted&&l>.08;if(v!==call.rSpeak){call.rSpeak=v;paintSpeak()}})}
  }else if(st==='disconnected'){call.reconn=true;clearTimeout(discT);discT=setTimeout(()=>{if(call&&pc===mine&&pc.connectionState!=='connected')restartIce()},4000)}

}
function addLocalTracks(){

}
function restartIce(){

  if(!rows.length){L.innerHTML=`<div class="empty">${E(T('لسه مفيش مكالمات','No calls yet'))}</div>`;return}
  L.innerHTML=rows.map(m=>{
   const i=callInfo(m),pid=i.mine?m.receiver_id:m.sender_id,p=friends.find(x=>x.id===pid)||(typeof pcache!=='undefined'&&pcache[pid])||{id:pid,username:''};
   const ok=friends.some(x=>x.id===pid),tm=new Date(m.created_at).toLocaleString(typeof locale==='function'?locale():undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
   return`<div class="cl-row${i.bad?' bad':''}">${av(p)}<div class="cl-row-t"><b>${E(profileName(p))}</b><small>${i.mine?IC2.out:IC2.inn}<span>${E(i.title)} · ${E(i.sub)}</span></small><small class="tm">${E(tm)}</small></div>${ok?`<button class="ibtn" type="button" onclick="callBack('${E(pid)}','audio')" aria-label="voice">${IC2.phone}</button><button class="ibtn" type="button" onclick="callBack('${E(pid)}','video')" aria-label="video">${IC2.video}</button>`:''}</div>`;
  }).join('');
 }catch(e){$('clLogL').innerHTML=`<div class="empty">${E(e.message||e)}</div>`}
};
guard('renderList',()=>{
 const _rl=renderList;
 renderList=function(){
  const r=_rl.apply(this,arguments);
  guard('cl-set',()=>{
   if((sub||view)!=='settings'||sub==='edit')return;
   const L=$('list');if(!L||!me||L.querySelector('#clLogRow'))return;
   const card=L.querySelector('#acctCard .card')||L.querySelector('.card');if(!card)return;
   card.insertAdjacentHTML('afterbegin',`<button class="ritem" id="clLogRow" onclick="openCallLog()">${IC2.hist}<span>${E(T('سجل المكالمات','Call history'))}</span></button>`);
  });
  return r;
 };
});

setInterval(()=>{guard('tick',()=>{ensureListen();ensureHeader();if(!me&&call)cleanup()})},1200);
ensureHeader();
window.__sahbyCallApi={callTo,accept,decline,hangup,state:()=>call,toggleMute,toggleCam,toggleScreen,flipCam,react,isCallMsg,callInfo};
})();
